import org.opensearch.gradle.BuildPlugin

/*
 * This script plugin configures formatting for Java source using Spotless
 * for Gradle. Since the act of formatting existing source can interfere
 * with developers' workflows, we don't automatically format all code
 * (yet). Instead, we maintain a list of projects that are excluded from
 * formatting, until we reach a point where we can comfortably format them
 * in one go without too much disruption.
 *
 * Any new sub-projects must not be added to the exclusions list!
 *
 * To perform a reformat, run:
 *
 *     ./gradlew spotlessApply
 *
 * To check the current format, run:
 *
 *     ./gradlew spotlessJavaCheck
 *
 * This is also carried out by the `precommit` task.
 *
 * For more about Spotless, see:
 *
 * https://github.com/diffplug/spotless/tree/master/plugin-gradle
 */

allprojects {
  plugins.withType(BuildPlugin).whenPluginAdded {
      project.apply plugin: "com.diffplug.spotless"

      // Only wire the Eclipse JDT step when a spotless task is actually being run, so non-spotless
      // Gradle invocations (test, assemble) don't provision the formatter at configuration time.
      def runningSpotlessTask = gradle.startParameter.taskNames.any { it.toLowerCase(Locale.ROOT).contains('spotless') }

      spotless {
        java {
          // Normally this isn't necessary, but we have Java sources in
          // non-standard places
          target '**/*.java'

          removeUnusedImports()
          forbidWildcardImports()
          importOrder(
              'de.thetaphi',
              'com.carrotsearch',
              'com.fasterxml',
              'com.avast',
              'com.sun',
              'com.maxmind|com.github|com.networknt|groovy|nebula',
              'org.antlr',
              'software.amazon',
              'com.azure|com.microsoft|com.ibm|com.google|joptsimple|org.apache|org.bouncycastle|org.codehaus|org.opensearch|org.objectweb|org.joda|org.hamcrest|org.openjdk|org.gradle|org.junit',
              'javax',
              'java',
              '',
              '\\#java|\\#org.opensearch|\\#org.hamcrest|\\#'
          )
          // Pin 4.40 explicitly: spotless 8.10.0+ ships an embedded lockfile for it, so the
          // formatter resolves from Maven Central through the mirror below instead of querying a
          // P2 update site at configuration time. Keep withP2Mirrors so any non-lockfile fallback
          // still hits the ci.opensearch.org mirror rather than the eclipse.org origin.
          if (runningSpotlessTask) {
            eclipse('4.40').withP2Mirrors(Map.of("https://download.eclipse.org/", "https://ci.opensearch.org/")).configFile rootProject.file('buildSrc/formatterConfig.xml')
          }
          trimTrailingWhitespace()
          endWithNewline()

          // See DEVELOPER_GUIDE.md for details of when to enable this.
          if (System.getProperty('spotless.paddedcell') != null) {
            paddedCell()
          }
        }
        format 'misc', {
            target '*.md', '*.gradle', '**/*.json', '**/*.yaml', '**/*.yml', '**/*.svg'

            targetExclude '**/simple-bulk11.json', '**/simple-msearch5.json', '**/build/**', '**/build-bootstrap/**', '**/target/**'

            trimTrailingWhitespace()
            endWithNewline()
        }
      }

      precommit.dependsOn 'spotlessJavaCheck'
  }
}
