---
"Filter cat indices by system metadata":

  - skip:
      version: " - 3.8.99"
      reason: system filtering was added to cat indices in 3.9.0
      features: allowed_warnings

  - do:
      allowed_warnings:
        - "this request accesses system indices: [.tasks-cat-system-test], but in a future major version, direct access to system indices will be prevented by default"
      indices.create:
        index: .tasks-cat-system-test
        body:
          settings:
            number_of_shards: 1
            number_of_replicas: 0
            index.hidden: true

  - do:
      cat.indices:
        index: "*tasks-cat-system-*"
        system: true
        h: "index,system,system.description"
        format: json

  - match: { 0.index: ".tasks-cat-system-test" }
  - match: { 0.system: "true" }
  - match: { 0.system\.description: "Task Result Index" }

  - do:
      cat.indices:
        index: "*tasks-cat-system-*"
        h: "index,system,system.description"
        format: json

  - length: { $body: 0 }

  - do:
      cat.indices:
        index: "*tasks-cat-system-*"
        system: true
        expand_wildcards: open
        h: "index,system,system.description"
        format: json

  - length: { $body: 0 }
