---
"Rollover with max_primary_shard_size condition":
  - skip:
      version: " - 3.10.99"
      reason: "max_primary_shard_size was added in 3.11.0"

  - do:
      indices.create:
        index: logs-1
        wait_for_active_shards: 1
        body:
          aliases:
            logs_search: {}

  - do:
      index:
        index: logs-1
        id:    "1"
        body:  { "foo": "hello world" }
        refresh: true

  # perform alias rollover with a large max_primary_shard_size, no action.
  - do:
      indices.rollover:
        alias: "logs_search"
        wait_for_active_shards: 1
        body:
          conditions:
            max_primary_shard_size: 100gb

  - match: { conditions: { "[max_primary_shard_size: 100gb]": false } }
  - match: { rolled_over: false }

  # perform alias rollover with a small max_primary_shard_size, got action.
  - do:
      indices.rollover:
        alias: "logs_search"
        wait_for_active_shards: 1
        body:
          conditions:
            max_primary_shard_size: 1b

  - match: { conditions: { "[max_primary_shard_size: 1b]": true } }
  - match: { rolled_over: true }
