---
setup:
  - skip:
      version: " - 3.9.99"
      reason: "terms_enum API added in 3.10.0"
  - do:
      indices.create:
        index: test
        body:
          settings:
            number_of_shards: 1
            number_of_replicas: 0
          mappings:
            properties:
              tag: { type: keyword }
              count: { type: long }
  - do:
      index:
        index: test
        refresh: true
        body: { tag: "a", count: 1 }

---
"Missing field":
  - skip:
      version: " - 3.9.99"
      reason: "terms_enum API added in 3.10.0"
  - do:
      catch: bad_request
      terms_enum:
        index: test
        body: { string: "a" }
  - match: { error.type: action_request_validation_exception }
  - match: { error.reason: "/\\[field\\]\\s+is\\s+required/" }

---
"Size below minimum":
  - skip:
      version: " - 3.9.99"
      reason: "terms_enum API added in 3.10.0"
  - do:
      catch: bad_request
      terms_enum:
        index: test
        body: { field: tag, size: 0 }

---
"Size above the configured maximum":
  - skip:
      version: " - 3.9.99"
      reason: "terms_enum API added in 3.10.0"
  - do:
      catch: bad_request
      terms_enum:
        index: test
        body: { field: tag, size: 1001 }
  - match: { error.reason: "/\\[size\\]/" }

---
"Field type without terms enumeration support":
  - skip:
      version: " - 3.9.99"
      reason: "terms_enum API added in 3.10.0"
  - do:
      catch: bad_request
      terms_enum:
        index: test
        body: { field: count }
  - match: { error.root_cause.0.reason: "/does\\s+not\\s+support\\s+terms\\s+enumeration/" }

---
"Filtered alias target":
  - skip:
      version: " - 3.9.99"
      reason: "terms_enum API added in 3.10.0"
  - do:
      indices.put_alias:
        index: test
        name: filtered
        body:
          filter:
            term: { tag: "a" }
  - do:
      catch: bad_request
      terms_enum:
        index: filtered
        body: { field: tag }
