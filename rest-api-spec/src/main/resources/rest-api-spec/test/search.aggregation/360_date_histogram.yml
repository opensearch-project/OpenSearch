setup:
  - skip:
      version: " - 7.1.99"
      reason:  calendar_interval introduced in 7.2.0

  - do:
      indices.create:
        index: test_date_hist
        body:
          settings:
            # There was a BWC issue that only showed up on empty shards. This
            # test has 4 docs and 5 shards makes sure we get one empty.
            number_of_shards: 5
          mappings:
            properties:
              range:
                type: date_range

  - do:
      bulk:
        index: test_date_hist
        refresh: true
        body:
          - '{"index": {}}'
          - '{"range": {"gte": "2016-01-01", "lt": "2016-01-02"}}'
          - '{"index": {}}'
          - '{"range": {"gte": "2016-01-02", "lt": "2016-01-03"}}'
          - '{"index": {}}'
          - '{"range": {"gte": "2016-02-01", "lt": "2016-02-02"}}'
          - '{"index": {}}'
          - '{"range": {"gte": "2016-03-01", "lt": "2016-03-02"}}'
          - '{"index": {}}'
          - '{"range": {"gte": "2016-04-01"}}'
          - '{"index": {}}'
          - '{"range": {"lt": "2016-02-01"}}'

---
"date_histogram on range with hard bounds":
  - skip:
      version: " - 7.9.99"
      reason:  hard_bounds introduced in 7.10.0

  - do:
      search:
        body:
          size: 0
          aggs:
            histo:
              date_histogram:
                field: range
                calendar_interval: month
                hard_bounds:
                  "min": "2015-06-01"
                  "max": "2016-06-01"

  - match: { hits.total.value: 6 }
  - length: { aggregations.histo.buckets: 13 }
  - match: { aggregations.histo.buckets.0.key_as_string: "2015-06-01T00:00:00.000Z" }
  - match: { aggregations.histo.buckets.0.doc_count: 1 }
  - match: { aggregations.histo.buckets.8.key_as_string: "2016-02-01T00:00:00.000Z" }
  - match: { aggregations.histo.buckets.8.doc_count: 1 }
  - match: { aggregations.histo.buckets.12.key_as_string: "2016-06-01T00:00:00.000Z" }
  - match: { aggregations.histo.buckets.12.doc_count: 1 }

---
"date_histogram creating empty buckets":
  - skip:
      version: " - 1.3.20"
      reason: fix added in 1.3.21

  - do:
      indices.create:
        index: test_cb
        body:
          settings:
            number_of_replicas: 0
            number_of_shards: 1
            refresh_interval: -1
          mappings:
            properties:
              date:
                type: date

  - do:
      bulk:
        index: test_cb
        refresh: true
        body:
          - '{"index": {}}'
          - '{"date": "2016-01-01"}'
          - '{"index": {}}'
          - '{"date": "2016-01-02"}'
          - '{"index": {}}'
          - '{"date": "2016-02-01"}'
          - '{"index": {}}'
          - '{"date": "2016-03-01"}'

  - do:
      catch: /too_many_buckets_exception/
      search:
        index: test_cb
        body:
          size: 0
          aggs:
            histo:
              date_histogram:
                field: date
                fixed_interval: 10s
                extended_bounds:
                  min: 0
                  max: 174155895372

  - match: { error.type: "search_phase_execution_exception" }
  - match: { error.caused_by.type: "too_many_buckets_exception" }
  - match: { status: 503 }

---
"date_histogram without extended bounds":
  - skip:
      version: " - 1.3.20"
      reason: fix added in 1.3.21

  - do:
      indices.create:
        index: test_sparse_dates
        body:
          settings:
            number_of_replicas: 0
            number_of_shards: 1
            refresh_interval: -1
          mappings:
            properties:
              timestamp:
                type: date

  - do:
      bulk:
        index: test_sparse_dates
        refresh: true
        body:
          - '{"index": {}}'
          - '{"timestamp": "2020-01-01T00:00:00Z"}'
          - '{"index": {}}'
          - '{"timestamp": "2025-01-01T00:00:00Z"}'

  - do:
      catch: /too_many_buckets_exception/
      search:
        index: test_sparse_dates
        body:
          size: 0
          aggs:
            timestamp_hist:
              date_histogram:
                field: timestamp
                calendar_interval: 1m
                min_doc_count: 0

  - match: { error.type: "search_phase_execution_exception" }
  - match: { error.caused_by.type: "too_many_buckets_exception" }
  - match: { status: 503 }

---
"date_histogram with empty index":
  - skip:
      version: " - 1.3.20"
      reason: fix added in 1.3.21

  - do:
      indices.create:
        index: test_empty_date_histogram
        body:
          settings:
            number_of_replicas: 0
            number_of_shards: 1
          mappings:
            properties:
              timestamp:
                type: date

  - do:
      catch: /too_many_buckets_exception/
      search:
        index: test_empty_date_histogram
        body:
          size: 0
          aggs:
            timestamp_hist:
              date_histogram:
                field: timestamp
                fixed_interval: 1ms
                extended_bounds:
                  min: 0
                  max: 100000

  - match: { error.type: "search_phase_execution_exception" }
  - match: { error.caused_by.type: "too_many_buckets_exception" }
  - match: { status: 503 }

---
"date_histogram with one-sided extended bounds":
  - skip:
      version: " - 1.3.20"
      reason: fix added in 1.3.21

  - do:
      indices.create:
        index: test_one_sided_date_histogram
        body:
          settings:
            number_of_replicas: 0
            number_of_shards: 1
          mappings:
            properties:
              timestamp:
                type: date

  - do:
      index:
        index: test_one_sided_date_histogram
        id: "1"
        refresh: true
        body:
          timestamp: "2020-01-01T00:00:00Z"

  - do:
      catch: /too_many_buckets_exception/
      search:
        index: test_one_sided_date_histogram
        body:
          size: 0
          aggs:
            timestamp_hist:
              date_histogram:
                field: timestamp
                fixed_interval: 1ms
                extended_bounds:
                  min: "2019-12-31T00:00:00Z"

  - match: { error.type: "search_phase_execution_exception" }
  - match: { error.caused_by.type: "too_many_buckets_exception" }
  - match: { status: 503 }

  - do:
      catch: /too_many_buckets_exception/
      search:
        index: test_one_sided_date_histogram
        body:
          size: 0
          aggs:
            timestamp_hist:
              date_histogram:
                field: timestamp
                fixed_interval: 1ms
                extended_bounds:
                  max: "2020-01-02T00:00:00Z"

  - match: { error.type: "search_phase_execution_exception" }
  - match: { error.caused_by.type: "too_many_buckets_exception" }
  - match: { status: 503 }
