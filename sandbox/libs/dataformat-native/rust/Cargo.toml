[workspace]
resolver = "2"
members = [
    "common",
    "macros",
    "lib",
    "../../../plugins/analytics-backend-datafusion/rust",
    "../../../plugins/parquet-data-format/src/main/rust",
    "../../../plugins/native-repository-s3/src/main/rust",
    "../../../plugins/native-repository-gcs/src/main/rust",
    "../../../plugins/native-repository-azure/src/main/rust",
    "../../../plugins/native-repository-fs/src/main/rust",
    "../../../libs/tiered-storage/src/main/rust",
    "../../../plugins/block-cache-foyer/src/main/rust",
]

[workspace.dependencies]
# Arrow / Parquet
arrow = { version = "=58.3.0", features = ["ffi"] }
arrow-array = "=58.3.0"
arrow-ipc = "=58.3.0"
arrow-schema = "=58.3.0"
arrow-buffer = "=58.3.0"
parquet = "=58.3.0"

# DataFusion
datafusion = "=54.0.0"
datafusion-expr = "=54.0.0"
datafusion-datasource = "=54.0.0"
datafusion-common = "=54.0.0"
datafusion-execution = "=54.0.0"
datafusion-physical-expr = "=54.0.0"
datafusion-substrait = "=54.0.0"

# Async
tokio = { version = "=1.52.3", features = ["full"] }
tokio-util = "=0.7.18"
futures = "=0.3.32"
tokio-stream = "=0.1.18"

# Serialization
prost = "=0.14.3"
substrait = "=0.63.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"

# Logging
log = "=0.4.29"

# Allocator
# disable_initial_exec_tls: Required because this library is loaded at runtime via dlopen/JVM FFM.
# Without it, jemalloc uses initial-exec TLS which fails on aarch64 Linux with:
#   "cannot allocate memory in static TLS block"
# The feature switches to global-dynamic TLS model, compatible with runtime loading.
tikv-jemallocator = { version = "=0.6.1", features = ["disable_initial_exec_tls", "profiling"] }
tikv-jemalloc-ctl = { version = "=0.6.1", features = ["stats"] }
tikv-jemalloc-sys = { version = "=0.6.1", features = ["stats"] }

# Misc
dashmap = { version = "=5.5.3", features = ["raw-api", "serde"] }
num_cpus = "=1.17.0"
object_store = "=0.13.2"
url = "=2.5.8"
tempfile = "=3.27.0"
chrono = "=0.4.44"
once_cell = "=1.21.4"
crc32fast = "=1.5.0"
parking_lot = "=0.12.5"
lazy_static = "=1.5.0"
rayon = "=1.11.0"
thiserror = "=1.0.69"
async-trait = "=0.1.89"
bytes = "=1.11.1"
criterion = { version = "=0.5.1", features = ["async_tokio"] }
tokio-metrics = { version = "=0.5.0", features = ["rt"] }
proptest = "=1.4.0"

# Internal
native-bridge-common = { path = "common" }
opensearch-tiered-storage = { path = "../../tiered-storage/src/main/rust" }
opensearch-repository-s3 = { path = "../../../plugins/native-repository-s3/src/main/rust" }
opensearch-repository-gcs = { path = "../../../plugins/native-repository-gcs/src/main/rust" }
opensearch-repository-azure = { path = "../../../plugins/native-repository-azure/src/main/rust" }
opensearch-repository-fs = { path = "../../../plugins/native-repository-fs/src/main/rust" }

[patch.crates-io]
# arrow-rs pinned to a fork that adds forward-cursor APIs to ParquetRecordBatchReader
# (skip_rows / read_next_batch / set_batch_size) for the Parquet doc-values reader.
# These need the parquet crate's internals, so they live in the fork. Every arrow/parquet
# crate in the dependency graph is repointed so a single arrow version is used throughout.
arrow = { git = "https://github.com/bharath-techie/arrow-rs.git", rev = "38b2f7a6a7f58d0dde9f932be1497444f7646a4c" }
arrow-arith = { git = "https://github.com/bharath-techie/arrow-rs.git", rev = "38b2f7a6a7f58d0dde9f932be1497444f7646a4c" }
arrow-array = { git = "https://github.com/bharath-techie/arrow-rs.git", rev = "38b2f7a6a7f58d0dde9f932be1497444f7646a4c" }
arrow-buffer = { git = "https://github.com/bharath-techie/arrow-rs.git", rev = "38b2f7a6a7f58d0dde9f932be1497444f7646a4c" }
arrow-cast = { git = "https://github.com/bharath-techie/arrow-rs.git", rev = "38b2f7a6a7f58d0dde9f932be1497444f7646a4c" }
arrow-csv = { git = "https://github.com/bharath-techie/arrow-rs.git", rev = "38b2f7a6a7f58d0dde9f932be1497444f7646a4c" }
arrow-data = { git = "https://github.com/bharath-techie/arrow-rs.git", rev = "38b2f7a6a7f58d0dde9f932be1497444f7646a4c" }
arrow-ipc = { git = "https://github.com/bharath-techie/arrow-rs.git", rev = "38b2f7a6a7f58d0dde9f932be1497444f7646a4c" }
arrow-json = { git = "https://github.com/bharath-techie/arrow-rs.git", rev = "38b2f7a6a7f58d0dde9f932be1497444f7646a4c" }
arrow-ord = { git = "https://github.com/bharath-techie/arrow-rs.git", rev = "38b2f7a6a7f58d0dde9f932be1497444f7646a4c" }
arrow-row = { git = "https://github.com/bharath-techie/arrow-rs.git", rev = "38b2f7a6a7f58d0dde9f932be1497444f7646a4c" }
arrow-schema = { git = "https://github.com/bharath-techie/arrow-rs.git", rev = "38b2f7a6a7f58d0dde9f932be1497444f7646a4c" }
arrow-select = { git = "https://github.com/bharath-techie/arrow-rs.git", rev = "38b2f7a6a7f58d0dde9f932be1497444f7646a4c" }
arrow-string = { git = "https://github.com/bharath-techie/arrow-rs.git", rev = "38b2f7a6a7f58d0dde9f932be1497444f7646a4c" }
parquet = { git = "https://github.com/bharath-techie/arrow-rs.git", rev = "38b2f7a6a7f58d0dde9f932be1497444f7646a4c" }

[profile.release]
lto = true
codegen-units = 1
incremental = true
debug = "line-tables-only"
strip = false

[profile.dev]
opt-level = 1
lto = false
codegen-units = 16
incremental = true
debug = "full"
strip = false
