apply plugin: 'opensearch.build'

description = 'Shared native bridge utilities for OpenSearch sandbox plugins'

dependencies {
    api project(':libs:opensearch-core')
    api project(':libs:opensearch-common')
    compileOnly project(':server')
    implementation "org.apache.logging.log4j:log4j-api:${versions.log4j}"
    compileOnly "org.apache.arrow:arrow-c-data:${versions.arrow}"

    testImplementation "com.carrotsearch.randomizedtesting:randomizedtesting-runner:${versions.randomizedrunner}"
    testImplementation "junit:junit:${versions.junit}"
    testImplementation "org.hamcrest:hamcrest:${versions.hamcrest}"
    testImplementation(project(":test:framework")) {
        exclude group: 'org.opensearch', module: 'opensearch-core'
        exclude group: 'org.opensearch', module: 'opensearch-common'
    }
}

tasks.named('forbiddenApisMain').configure {
    replaceSignatureFiles 'jdk-signatures'
}

jarHell.enabled = false

// FFM is stable since JDK 22. Override project-wide JDK 21 target for this module.
java {
    sourceCompatibility = JavaVersion.toVersion(25)
    targetCompatibility = JavaVersion.toVersion(25)
}

// missingJavadoc hardcodes --release 21 which hides FFM types (stable since JDK 22).
// Disable for this module until the framework supports per-project release overrides.
tasks.matching { it.name == 'missingJavadoc' }.configureEach {
    enabled = false
}

tasks.withType(Test).configureEach {
    jvmArgs += ['--enable-native-access=ALL-UNNAMED']
}

// ═══════════════════════════════════════════════════════════════════
// Unified Rust native library build (FFM)
// ═══════════════════════════════════════════════════════════════════

def osName = System.getProperty('os.name').toLowerCase()
def libPrefix = osName.contains('windows') ? '' : 'lib'
def libExtension = osName.contains('windows') ? '.dll' : (osName.contains('mac') ? '.dylib' : '.so')
def nativeLibName = "opensearch_native"
def buildType = project.hasProperty('rustDebug') ? 'debug' : 'release'
def rustWorkspaceDir = file("${projectDir}/rust")
def nativeLibFile = file("${rustWorkspaceDir}/target/${buildType}/${libPrefix}${nativeLibName}${libExtension}")

// ═══════════════════════════════════════════════════════════════════
// Patched third-party crate sources
//
// parquet is fetched from crates.io, checksum-verified, and patched in place. The resulting
// directory is what rust/Cargo.toml's [patch.crates-io] points at. See rust/patches/README.md.
// ═══════════════════════════════════════════════════════════════════
def parquetVersion = '58.3.0'
def parquetPatchFile = file("${rustWorkspaceDir}/patches/parquet-${parquetVersion}-forward-cursor.patch")
def parquetShaFile = file("${rustWorkspaceDir}/patches/parquet-${parquetVersion}.crate.sha256")
def patchedParquetDir = file("${rustWorkspaceDir}/build/patched/parquet-${parquetVersion}")
def patchedParentDir = file("${rustWorkspaceDir}/build/patched")
def parquetDownloadDir = file("${rustWorkspaceDir}/build/downloads")

def repoRootPath = project.rootDir.absolutePath
def offlineBuild = gradle.startParameter.offline

def sha256Of = { File target ->
    def digest = MessageDigest.getInstance('SHA-256')
    target.eachByte(64 * 1024) { buffer, bytesRead -> digest.update(buffer, 0, bytesRead) }
    digest.digest().encodeHex().toString()
}

task preparePatchedParquet {
    description = "Download parquet ${parquetVersion} from crates.io, verify its checksum, and apply the in-tree patch"
    group = 'build'

    inputs.files parquetPatchFile, parquetShaFile
    outputs.dir patchedParquetDir

    doLast {
        if (!parquetPatchFile.exists() || !parquetShaFile.exists()) {
            throw new GradleException(
                "Missing patch inputs for parquet ${parquetVersion}. Expected both:\n" +
                "  ${parquetPatchFile}\n  ${parquetShaFile}\n" +
                "If the parquet version was bumped, regenerate both for the new version.")
        }

        // Cargo only warns when a [patch.crates-io] entry does not match the dependency
        // requirement, then builds the unpatched crate. Fail here instead.
        def manifestText = new File(rustWorkspaceDir, 'Cargo.toml').text
        def requirement = (manifestText =~ /(?m)^\s*parquet\s*=\s*"([^"]+)"/)
        if (requirement.find()) {
            def requestedVersion = requirement.group(1).replaceFirst(/^=/, '')
            if (requestedVersion != parquetVersion) {
                throw new GradleException(
                    "parquet version mismatch: Cargo.toml requires '${requirement.group(1)}' but this task " +
                    "patches ${parquetVersion}.\nUpdate parquetVersion in build.gradle, the " +
                    "[patch.crates-io] path in Cargo.toml, and regenerate patches/parquet-*.patch " +
                    "and patches/parquet-*.crate.sha256 for the new version.")
            }
        }

        def downloadDir = parquetDownloadDir
        downloadDir.mkdirs()
        def tarball = new File(downloadDir, "parquet-${parquetVersion}.crate")

        if (!tarball.exists()) {
            if (offlineBuild) {
                throw new GradleException(
                    "--offline was requested but ${tarball} is not cached. Run once without --offline.")
            }
            def url = "https://static.crates.io/crates/parquet/parquet-${parquetVersion}.crate"
            logger.lifecycle("Downloading ${url}")
            def tmp = new File(downloadDir, "parquet-${parquetVersion}.crate.part")
            def connection = new URL(url).openConnection()
            connection.connectTimeout = 30_000
            connection.readTimeout = 120_000
            tmp.withOutputStream { out -> connection.inputStream.withCloseable { inp -> out << inp } }
            if (!tmp.renameTo(tarball)) {
                throw new GradleException("Could not move ${tmp} to ${tarball}")
            }
        }

        // Integrity gate. Path dependencies carry no Cargo.lock checksum, so this is what
        // guarantees we patched the same bytes that were reviewed.
        def expected = parquetShaFile.text.trim().split(/\s+/)[0]
        def actual = sha256Of(tarball)
        if (actual != expected) {
            tarball.delete()
            throw new GradleException(
                "Checksum mismatch for parquet-${parquetVersion}.crate\n" +
                "  expected: ${expected}\n" +
                "  actual:   ${actual}\n" +
                "The downloaded tarball was deleted. Re-run to retry.")
        }

        patchedParquetDir.deleteDir()
        patchedParentDir.mkdirs()
        def untar = new ProcessBuilder('tar', '-xzf', tarball.absolutePath, '-C', patchedParentDir.absolutePath)
            .redirectErrorStream(true)
            .start()
        def untarOutput = untar.inputStream.text
        if (untar.waitFor() != 0) {
            throw new GradleException("Failed to unpack ${tarball.name}:\n${untarOutput}")
        }

        // GIT_CEILING_DIRECTORIES is required. The unpacked tree sits under gitignored build/,
        // and git apply skips paths it considers outside its work tree, exiting 0 without
        // applying anything. Capping repository discovery makes it treat the tree as standalone.
        def runGit = { List<String> args ->
            def proc = new ProcessBuilder(['git'] + args)
                .directory(patchedParquetDir)
                .redirectErrorStream(true)
            proc.environment().put('GIT_CEILING_DIRECTORIES', repoRootPath)
            def started = proc.start()
            def out = started.inputStream.text
            [exit: started.waitFor(), output: out]
        }

        // Files the patch rewrites, read from its "+++ b/parquet/<path>" headers with the two
        // -p2 components stripped. Hashed before and after so a no-op apply is detectable.
        def patchTargets = parquetPatchFile.readLines()
            .findAll { it.startsWith('+++ ') }
            .collect { it.substring(4).trim().split('\t')[0].split('/').drop(2).join('/') }
            .findAll { it }
        if (patchTargets.isEmpty()) {
            throw new GradleException("Could not read any target paths from ${parquetPatchFile}")
        }
        def digestsBeforeApply = patchTargets.collectEntries {
            [it, sha256Of(new File(patchedParquetDir, it))]
        }

        def applied = runGit(['apply', '-p2', parquetPatchFile.absolutePath])
        if (applied.exit != 0) {
            throw new GradleException(
                "Failed to apply ${parquetPatchFile.name} to ${patchedParquetDir}:\n${applied.output}")
        }

        // git apply exits 0 for paths it decides to skip, so a zero status does not prove the
        // patch landed. Every target file must have actually changed.
        def untouched = patchTargets.findAll {
            sha256Of(new File(patchedParquetDir, it)) == digestsBeforeApply[it]
        }
        if (!untouched.isEmpty()) {
            throw new GradleException(
                "${parquetPatchFile.name} left these files unchanged: ${untouched.join(', ')}\n" +
                "git apply output:\n${applied.output}")
        }
        logger.lifecycle("Applied ${parquetPatchFile.name} to ${patchTargets.size()} file(s) in ${patchedParquetDir}")
    }
}

task buildRustLibrary(type: Exec) {
    description = 'Build the unified Rust native library from the Cargo workspace'
    group = 'build'
    workingDir rustWorkspaceDir
    // cargo cannot read the workspace manifest until [patch.crates-io]'s path exists.
    dependsOn preparePatchedParquet

    def cargoExecutable = 'cargo'
    def possibleCargoPaths = [
        System.getenv('HOME') + '/.cargo/bin/cargo',
        '/usr/local/bin/cargo',
        'cargo'
    ]
    for (String path : possibleCargoPaths) {
        if (new File(path).exists()) { cargoExecutable = path; break }
    }

    def cargoArgs = [cargoExecutable, 'build', '-p', 'opensearch-native-lib']
    if (buildType == 'release') { cargoArgs.add('--release') }
    commandLine cargoArgs

    inputs.files fileTree("${rustWorkspaceDir}/common/src")
    inputs.files fileTree("${rustWorkspaceDir}/lib/src")
    inputs.file "${rustWorkspaceDir}/Cargo.toml"
    // Resolved dependency versions live here, so a lockfile change (e.g. pinning a transitive
    // crate) must invalidate the cached native library.
    inputs.file "${rustWorkspaceDir}/Cargo.lock"
    // Editing the patch changes the compiled parquet crate, so invalidate the cached build.
    inputs.file parquetPatchFile
    // Track all workspace member Rust sources so changes to plugin crates (e.g.,
    // analytics-backend-datafusion/rust/src/ffm.rs) invalidate the cached build.
    inputs.files fileTree("${projectDir}/../../plugins/analytics-backend-datafusion/rust/src")
    inputs.files fileTree("${projectDir}/../../plugins/parquet-data-format/src/main/rust/src")
    inputs.files fileTree("${projectDir}/../../plugins/native-repository-s3/src/main/rust/src")
    inputs.files fileTree("${projectDir}/../../plugins/native-repository-gcs/src/main/rust/src")
    inputs.files fileTree("${projectDir}/../../plugins/native-repository-azure/src/main/rust/src")
    inputs.files fileTree("${projectDir}/../../plugins/native-repository-fs/src/main/rust/src")
    inputs.files fileTree("${projectDir}/../../libs/tiered-storage/src/main/rust/src")
    inputs.files fileTree("${projectDir}/../../plugins/block-cache-foyer/src/main/rust/src")
    outputs.file nativeLibFile
}

// External override: reuse a prebuilt .dylib from another worktree, a blessed shared copy,
// or a CI-provided binary. Set OPENSEARCH_NATIVE_LIB (env) or -PnativeLibOverride to an
// absolute .dylib/.so/.dll path; buildRustLibrary is skipped and nativeLibPath resolves to
// the override. Consumers across sandbox/plugins read ext.nativeLibPath, so the override
// propagates without per-plugin changes.
def nativeLibOverride = project.findProperty('nativeLibOverride') ?: System.getenv('OPENSEARCH_NATIVE_LIB')
def resolvedNativeLib = nativeLibOverride ? file(nativeLibOverride) : nativeLibFile
ext.nativeLibPath = resolvedNativeLib
buildRustLibrary.onlyIf { nativeLibOverride == null }
// onlyIf skips a task but not its dependencies, so the override must skip the patch prep too -
// otherwise reusing a prebuilt library still requires a crates.io download.
preparePatchedParquet.onlyIf { nativeLibOverride == null }

assemble.dependsOn buildRustLibrary

test {
    systemProperty 'tests.security.manager', 'false'
    systemProperty 'native.lib.path', resolvedNativeLib.absolutePath
    jvmArgs += ['--enable-native-access=ALL-UNNAMED']
    dependsOn buildRustLibrary
}

tasks.named('thirdPartyAudit').configure {
    ignoreMissingClasses(
        'org.osgi.framework.Bundle',
        'org.osgi.framework.BundleActivator',
        'org.osgi.framework.BundleContext',
        'org.osgi.framework.BundleEvent',
        'org.osgi.framework.FrameworkUtil',
        'org.osgi.framework.ServiceReference',
        'org.osgi.framework.ServiceRegistration',
        'org.osgi.framework.SynchronousBundleListener',
        'org.osgi.framework.wiring.BundleRevision',
        'org.osgi.framework.wiring.BundleWire',
        'org.osgi.framework.wiring.BundleWiring'
    )
}
