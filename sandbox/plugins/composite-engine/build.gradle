opensearchplugin {
  description = 'Composite indexing engine plugin that orchestrates multi-format indexing across multiple data format engines.'
  classname = 'org.opensearch.composite.CompositeDataFormatPlugin'
}

apply plugin: 'opensearch.internal-cluster-test'

java { sourceCompatibility = JavaVersion.toVersion(25); targetCompatibility = JavaVersion.toVersion(25) }

// Test compilation needs JDK 25 to consume parquet-data-format (which targets JDK 25)
tasks.named('compileTestJava').configure {
  sourceCompatibility = JavaVersion.toVersion(25)
  targetCompatibility = JavaVersion.toVersion(25)
}

tasks.named('compileInternalClusterTestJava').configure {
  sourceCompatibility = JavaVersion.toVersion(25)
  targetCompatibility = JavaVersion.toVersion(25)
}

tasks.named('internalClusterTest').configure {
  jvmArgs += [
    '--add-opens=java.base/java.nio=ALL-UNNAMED',
    '--enable-native-access=ALL-UNNAMED'
  ]
}

internalClusterTest {
  // arrow-memory-netty initialization requires these Netty Unsafe flags
  systemProperty 'io.netty.allocator.numDirectArenas', '1'
  systemProperty 'io.netty.noUnsafe', 'false'
  systemProperty 'io.netty.tryUnsafe', 'true'
  systemProperty 'io.netty.tryReflectionSetAccessible', 'true'
  // Disable OpenSearch's Netty4Utils.setAvailableProcessors() so randomized node.processors values
  // across test methods do not collide on Netty's process-wide NettyRuntime static.
  // See Netty4Utils.java: opensearch.set.netty.runtime.available.processors flag.
  systemProperty 'opensearch.set.netty.runtime.available.processors', 'false'
  systemProperty 'native.lib.path', project(':sandbox:libs:dataformat-native').ext.nativeLibPath.absolutePath
  dependsOn ':sandbox:libs:dataformat-native:buildRustLibrary'
}

dependencies {
  api project(':libs:opensearch-concurrent-queue')
  implementation project(':sandbox:libs:plugin-stats-spi')
  compileOnly project(':server')
  testImplementation project(':test:framework')
  testImplementation project(':sandbox:plugins:parquet-data-format')
  testImplementation project(':sandbox:plugins:analytics-backend-lucene')
  testImplementation project(':sandbox:plugins:analytics-backend-datafusion')
  internalClusterTestImplementation project(':plugins:arrow-base')
  internalClusterTestImplementation project(':sandbox:plugins:parquet-data-format')
  internalClusterTestImplementation project(':sandbox:plugins:analytics-backend-lucene')
  internalClusterTestImplementation project(':sandbox:plugins:analytics-backend-datafusion')
  internalClusterTestImplementation project(':sandbox:plugins:analytics-engine')
  internalClusterTestImplementation project(':sandbox:libs:analytics-framework')
  internalClusterTestImplementation project(':sandbox:plugins:native-repository-fs')
  // Netty4 HTTP transport for ITs that use the low-level RestClient (e.g., DataFormatStatsIT, *DataFormatApi*IT).
  internalClusterTestImplementation project(':modules:transport-netty4')
}

// ---- JMH benchmark source set ----
// Microbenchmarks for the indexing hot path (e.g. CompositeDocumentInput.addField broadcast). Lives here
// because the shared :benchmarks module only depends on :server and cannot reach this JDK-25-gated sandbox
// plugin. Same wiring as :sandbox:plugins:parquet-data-format and :libs:opensearch-concurrent-queue.
sourceSets {
  jmh {
    java.srcDirs = ['src/jmh/java']
    compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
  }
}

dependencies {
  jmhImplementation "org.openjdk.jmh:jmh-core:${versions.jmh}"
  jmhAnnotationProcessor "org.openjdk.jmh:jmh-generator-annprocess:${versions.jmh}"
  // :server is compileOnly for the plugin (provided by the OpenSearch runtime). The JMH fork has no such
  // runtime, so put it on the benchmark runtime classpath explicitly.
  jmhImplementation project(':server')
  jmhImplementation project(':sandbox:libs:plugin-stats-spi')
}

// JMH generated code uses forbidden APIs — skip checking the jmh source set.
tasks.matching { it.name == 'forbiddenApisJmh' }.configureEach { enabled = false }

// Wire the JMH benchmark annotation processor.
tasks.named('compileJmhJava').configure {
  options.compilerArgs.addAll(["-processor", "org.openjdk.jmh.generators.BenchmarkProcessor"])
}

// Convenience task: ./gradlew -Dsandbox.enabled=true :sandbox:plugins:composite-engine:jmh [-Pjmh.includes=<regex>]
tasks.register('jmh', JavaExec) {
  dependsOn jmhClasses
  mainClass = 'org.openjdk.jmh.Main'
  classpath = sourceSets.jmh.runtimeClasspath
  if (project.hasProperty('jmh.includes')) {
    args project.property('jmh.includes')
  }
}
