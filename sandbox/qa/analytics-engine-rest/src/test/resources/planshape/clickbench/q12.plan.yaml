# Multi-key grouped exact COUNT(DISTINCT UserID) by (MobilePhone, MobilePhoneModel) with != '' and a composite sort.
# Stays exact (no HLL/approx): multi-shard gathers all rows to the coordinator and dedups there — no per-shard partial.
query: q12
ppl_file: q12.ppl
applies: [prod2s, prod1s]
plans:
  prod2s:
    post_cbo: |
      OpenSearchSort(sort0=[$0], sort1=[$1], sort2=[$2], dir0=[DESC-nulls-last], dir1=[ASC-nulls-first], dir2=[ASC-nulls-first], fetch=[10000], viableBackends=[[datafusion]])
        OpenSearchSort(sort0=[$0], sort1=[$1], sort2=[$2], dir0=[DESC-nulls-last], dir1=[ASC-nulls-first], dir2=[ASC-nulls-first], fetch=[10], viableBackends=[[datafusion]])
          OpenSearchProject(u=[$2], MobilePhone=[$0], MobilePhoneModel=[$1], viableBackends=[[datafusion]])
            OpenSearchAggregate(group=[{0, 1}], u=[COUNT(DISTINCT $2)], mode=[SINGLE], viableBackends=[[datafusion]])
              OpenSearchExchangeReducer(viableBackends=[[datafusion]], exchange=[ExchangeInfo[distributionType=SINGLETON, partitionKeyIndices=[], partitionCount=0]])
                OpenSearchProject(MobilePhone=[$44], MobilePhoneModel=[$45], UserID=[$97], viableBackends=[[lucene, datafusion]])
                  OpenSearchFilter(condition=[ANNOTATED_PREDICATE(id=0, backends=[lucene, datafusion], <>($45, ''))], viableBackends=[[lucene, datafusion]])
                    OpenSearchTableScan(table=[[<scrubbed>]], viableBackends=[[lucene, datafusion]])
    fragment: |
      [SHARD_FRAGMENT chosen_backend=datafusion tree_shape=CONJUNCTIVE]
      OpenSearchProject(MobilePhone=[$44], MobilePhoneModel=[$45], UserID=[$97], viableBackends=[[lucene, datafusion]])
        OpenSearchFilter(condition=[ANNOTATED_PREDICATE(id=0, backends=[lucene, datafusion], <>($45, ''))], viableBackends=[[lucene, datafusion]])
          OpenSearchTableScan(table=[[<scrubbed>]], viableBackends=[[lucene, datafusion]])
      [COORDINATOR_REDUCE chosen_backend=datafusion tree_shape=NONE]
      OpenSearchSort(sort0=[$0], sort1=[$1], sort2=[$2], dir0=[DESC-nulls-last], dir1=[ASC-nulls-first], dir2=[ASC-nulls-first], fetch=[10000], viableBackends=[[datafusion]])
        OpenSearchSort(sort0=[$0], sort1=[$1], sort2=[$2], dir0=[DESC-nulls-last], dir1=[ASC-nulls-first], dir2=[ASC-nulls-first], fetch=[10], viableBackends=[[datafusion]])
          OpenSearchProject(u=[$2], MobilePhone=[$0], MobilePhoneModel=[$1], viableBackends=[[datafusion]])
            OpenSearchAggregate(group=[{0, 1}], u=[COUNT(DISTINCT $2)], mode=[SINGLE], viableBackends=[[datafusion]])
              OpenSearchExchangeReducer(viableBackends=[[datafusion]], exchange=[ExchangeInfo[distributionType=SINGLETON, partitionKeyIndices=[], partitionCount=0]])
                OpenSearchStageInputScan(childStageId=[0], viableBackends=[[datafusion]])
    shard_physical_1seg: |
      CooperativeExec
        QueryShardExec: partitions=1, segments=1, ordering=unsorted
    shard_physical_nseg: |
      CooperativeExec
        QueryShardExec: partitions=2, segments=2, ordering=unsorted
    coord_physical: |
      ProjectionExec: expr=[count(DISTINCT input-0.UserID)@0 as u, MobilePhone@1 as MobilePhone, MobilePhoneModel@2 as MobilePhoneModel]
        SortPreservingMergeExec: [count(DISTINCT input-0.UserID)@0 DESC NULLS LAST, MobilePhone@1 ASC, MobilePhoneModel@2 ASC], fetch=10
          SortExec: TopK(fetch=10), expr=[count(DISTINCT input-0.UserID)@0 DESC NULLS LAST, MobilePhone@1 ASC, MobilePhoneModel@2 ASC], preserve_partitioning=[true]
            ProjectionExec: expr=[count(alias1)@2 as count(DISTINCT input-0.UserID), MobilePhone@0 as MobilePhone, MobilePhoneModel@1 as MobilePhoneModel]
              AggregateExec: mode=FinalPartitioned, gby=[MobilePhone@0 as MobilePhone, MobilePhoneModel@1 as MobilePhoneModel], aggr=[count(alias1)]
                RepartitionExec: partitioning=Hash([MobilePhone@0, MobilePhoneModel@1], 4), input_partitions=4
                  AggregateExec: mode=Partial, gby=[MobilePhone@0 as MobilePhone, MobilePhoneModel@1 as MobilePhoneModel], aggr=[count(alias1)]
                    AggregateExec: mode=FinalPartitioned, gby=[MobilePhone@0 as MobilePhone, MobilePhoneModel@1 as MobilePhoneModel, alias1@2 as alias1], aggr=[]
                      RepartitionExec: partitioning=Hash([MobilePhone@0, MobilePhoneModel@1, alias1@2], 4), input_partitions=4
                        AggregateExec: mode=Partial, gby=[MobilePhone@0 as MobilePhone, MobilePhoneModel@1 as MobilePhoneModel, UserID@2 as alias1], aggr=[]
                          RepartitionExec: partitioning=RoundRobinBatch(4), input_partitions=1
                            StreamingTableExec: partition_sizes=1, projection=[MobilePhone, MobilePhoneModel, UserID]
  prod1s:
    post_cbo: |
      OpenSearchSort(sort0=[$0], sort1=[$1], sort2=[$2], dir0=[DESC-nulls-last], dir1=[ASC-nulls-first], dir2=[ASC-nulls-first], fetch=[10000], viableBackends=[[datafusion]])
        OpenSearchSort(sort0=[$0], sort1=[$1], sort2=[$2], dir0=[DESC-nulls-last], dir1=[ASC-nulls-first], dir2=[ASC-nulls-first], fetch=[10], viableBackends=[[datafusion]])
          OpenSearchProject(u=[$2], MobilePhone=[$0], MobilePhoneModel=[$1], viableBackends=[[datafusion]])
            OpenSearchAggregate(group=[{0, 1}], u=[COUNT(DISTINCT $2)], mode=[SINGLE], viableBackends=[[datafusion]])
              OpenSearchProject(MobilePhone=[$44], MobilePhoneModel=[$45], UserID=[$97], viableBackends=[[lucene, datafusion]])
                OpenSearchFilter(condition=[ANNOTATED_PREDICATE(id=0, backends=[lucene, datafusion], <>($45, ''))], viableBackends=[[lucene, datafusion]])
                  OpenSearchTableScan(table=[[<scrubbed>]], viableBackends=[[lucene, datafusion]])
    fragment: |
      [SHARD_FRAGMENT chosen_backend=datafusion tree_shape=CONJUNCTIVE]
      OpenSearchSort(sort0=[$0], sort1=[$1], sort2=[$2], dir0=[DESC-nulls-last], dir1=[ASC-nulls-first], dir2=[ASC-nulls-first], fetch=[10000], viableBackends=[[datafusion]])
        OpenSearchSort(sort0=[$0], sort1=[$1], sort2=[$2], dir0=[DESC-nulls-last], dir1=[ASC-nulls-first], dir2=[ASC-nulls-first], fetch=[10], viableBackends=[[datafusion]])
          OpenSearchProject(u=[$2], MobilePhone=[$0], MobilePhoneModel=[$1], viableBackends=[[datafusion]])
            OpenSearchAggregate(group=[{0, 1}], u=[COUNT(DISTINCT $2)], mode=[SINGLE], viableBackends=[[datafusion]])
              OpenSearchProject(MobilePhone=[$44], MobilePhoneModel=[$45], UserID=[$97], viableBackends=[[lucene, datafusion]])
                OpenSearchFilter(condition=[ANNOTATED_PREDICATE(id=0, backends=[lucene, datafusion], <>($45, ''))], viableBackends=[[lucene, datafusion]])
                  OpenSearchTableScan(table=[[<scrubbed>]], viableBackends=[[lucene, datafusion]])
    shard_physical_1seg: |
      ProjectionExec: expr=[count(DISTINCT <scrubbed>.UserID)@0 as u, MobilePhone@1 as MobilePhone, MobilePhoneModel@2 as MobilePhoneModel]
        SortPreservingMergeExec: [count(DISTINCT <scrubbed>.UserID)@0 DESC NULLS LAST, MobilePhone@1 ASC, MobilePhoneModel@2 ASC], fetch=10
          SortExec: TopK(fetch=10), expr=[count(DISTINCT <scrubbed>.UserID)@0 DESC NULLS LAST, MobilePhone@1 ASC, MobilePhoneModel@2 ASC], preserve_partitioning=[true]
            ProjectionExec: expr=[count(alias1)@2 as count(DISTINCT <scrubbed>.UserID), MobilePhone@0 as MobilePhone, MobilePhoneModel@1 as MobilePhoneModel]
              AggregateExec: mode=FinalPartitioned, gby=[MobilePhone@0 as MobilePhone, MobilePhoneModel@1 as MobilePhoneModel], aggr=[count(alias1)]
                RepartitionExec: partitioning=Hash([MobilePhone@0, MobilePhoneModel@1], 4), input_partitions=4
                  AggregateExec: mode=Partial, gby=[MobilePhone@0 as MobilePhone, MobilePhoneModel@1 as MobilePhoneModel], aggr=[count(alias1)]
                    AggregateExec: mode=FinalPartitioned, gby=[MobilePhone@0 as MobilePhone, MobilePhoneModel@1 as MobilePhoneModel, alias1@2 as alias1], aggr=[]
                      RepartitionExec: partitioning=Hash([MobilePhone@0, MobilePhoneModel@1, alias1@2], 4), input_partitions=4
                        AggregateExec: mode=Partial, gby=[MobilePhone@0 as MobilePhone, MobilePhoneModel@1 as MobilePhoneModel, UserID@2 as alias1], aggr=[]
                          RepartitionExec: partitioning=RoundRobinBatch(4), input_partitions=1
                            QueryShardExec: partitions=1, segments=1, ordering=unsorted
    shard_physical_nseg: |
      ProjectionExec: expr=[count(DISTINCT <scrubbed>.UserID)@0 as u, MobilePhone@1 as MobilePhone, MobilePhoneModel@2 as MobilePhoneModel]
        SortPreservingMergeExec: [count(DISTINCT <scrubbed>.UserID)@0 DESC NULLS LAST, MobilePhone@1 ASC, MobilePhoneModel@2 ASC], fetch=10
          SortExec: TopK(fetch=10), expr=[count(DISTINCT <scrubbed>.UserID)@0 DESC NULLS LAST, MobilePhone@1 ASC, MobilePhoneModel@2 ASC], preserve_partitioning=[true]
            ProjectionExec: expr=[count(alias1)@2 as count(DISTINCT <scrubbed>.UserID), MobilePhone@0 as MobilePhone, MobilePhoneModel@1 as MobilePhoneModel]
              AggregateExec: mode=FinalPartitioned, gby=[MobilePhone@0 as MobilePhone, MobilePhoneModel@1 as MobilePhoneModel], aggr=[count(alias1)]
                RepartitionExec: partitioning=Hash([MobilePhone@0, MobilePhoneModel@1], 4), input_partitions=4
                  AggregateExec: mode=Partial, gby=[MobilePhone@0 as MobilePhone, MobilePhoneModel@1 as MobilePhoneModel], aggr=[count(alias1)]
                    AggregateExec: mode=FinalPartitioned, gby=[MobilePhone@0 as MobilePhone, MobilePhoneModel@1 as MobilePhoneModel, alias1@2 as alias1], aggr=[]
                      RepartitionExec: partitioning=Hash([MobilePhone@0, MobilePhoneModel@1, alias1@2], 4), input_partitions=4
                        AggregateExec: mode=Partial, gby=[MobilePhone@0 as MobilePhone, MobilePhoneModel@1 as MobilePhoneModel, UserID@2 as alias1], aggr=[]
                          RepartitionExec: partitioning=RoundRobinBatch(4), input_partitions=2
                            QueryShardExec: partitions=2, segments=2, ordering=unsorted
