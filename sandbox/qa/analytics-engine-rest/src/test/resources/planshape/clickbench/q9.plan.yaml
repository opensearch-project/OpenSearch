# Grouped exact COUNT(DISTINCT UserID) by RegionID with sort+head (TopK, fetch=10).
# Stays exact (no HLL/approx): multi-shard gathers all rows to the coordinator and dedups there — no per-shard partial.
query: q9
ppl_file: q9.ppl
applies: [prod2s, prod1s]
plans:
  prod2s:
    post_cbo: |
      OpenSearchSort(sort0=[$0], sort1=[$1], dir0=[DESC-nulls-last], dir1=[ASC-nulls-first], fetch=[10000], viableBackends=[[datafusion]])
        OpenSearchSort(sort0=[$0], sort1=[$1], dir0=[DESC-nulls-last], dir1=[ASC-nulls-first], fetch=[10], viableBackends=[[datafusion]])
          OpenSearchProject(u=[$1], RegionID=[$0], viableBackends=[[datafusion]])
            OpenSearchAggregate(group=[{0}], u=[COUNT(DISTINCT $1)], mode=[SINGLE], viableBackends=[[datafusion]])
              OpenSearchExchangeReducer(viableBackends=[[datafusion]], exchange=[ExchangeInfo[distributionType=SINGLETON, partitionKeyIndices=[], partitionCount=0]])
                OpenSearchProject(RegionID=[$65], UserID=[$97], viableBackends=[[lucene, datafusion]])
                  OpenSearchTableScan(table=[[<scrubbed>]], viableBackends=[[lucene, datafusion]])
    fragment: |
      [SHARD_FRAGMENT chosen_backend=datafusion tree_shape=NONE]
      OpenSearchProject(RegionID=[$65], UserID=[$97], viableBackends=[[lucene, datafusion]])
        OpenSearchTableScan(table=[[<scrubbed>]], viableBackends=[[lucene, datafusion]])
      [COORDINATOR_REDUCE chosen_backend=datafusion tree_shape=NONE]
      OpenSearchSort(sort0=[$0], sort1=[$1], dir0=[DESC-nulls-last], dir1=[ASC-nulls-first], fetch=[10000], viableBackends=[[datafusion]])
        OpenSearchSort(sort0=[$0], sort1=[$1], dir0=[DESC-nulls-last], dir1=[ASC-nulls-first], fetch=[10], viableBackends=[[datafusion]])
          OpenSearchProject(u=[$1], RegionID=[$0], viableBackends=[[datafusion]])
            OpenSearchAggregate(group=[{0}], u=[COUNT(DISTINCT $1)], mode=[SINGLE], viableBackends=[[datafusion]])
              OpenSearchExchangeReducer(viableBackends=[[datafusion]], exchange=[ExchangeInfo[distributionType=SINGLETON, partitionKeyIndices=[], partitionCount=0]])
                OpenSearchStageInputScan(childStageId=[0], viableBackends=[[datafusion]])
    shard_physical: |
      DataSourceExec: file_groups={<scrubbed>}, projection=[RegionID, UserID], file_type=parquet
    coord_physical: |
      ProjectionExec: expr=[count(DISTINCT input-0.UserID)@0 as u, RegionID@1 as RegionID]
        SortPreservingMergeExec: [count(DISTINCT input-0.UserID)@0 DESC NULLS LAST, RegionID@1 ASC], fetch=10
          SortExec: TopK(fetch=10), expr=[count(DISTINCT input-0.UserID)@0 DESC NULLS LAST, RegionID@1 ASC], preserve_partitioning=[true]
            ProjectionExec: expr=[count(alias1)@1 as count(DISTINCT input-0.UserID), RegionID@0 as RegionID]
              AggregateExec: mode=FinalPartitioned, gby=[RegionID@0 as RegionID], aggr=[count(alias1)]
                RepartitionExec: partitioning=Hash([RegionID@0], 4), input_partitions=4
                  AggregateExec: mode=Partial, gby=[RegionID@0 as RegionID], aggr=[count(alias1)]
                    AggregateExec: mode=FinalPartitioned, gby=[RegionID@0 as RegionID, alias1@1 as alias1], aggr=[]
                      RepartitionExec: partitioning=Hash([RegionID@0, alias1@1], 4), input_partitions=4
                        AggregateExec: mode=Partial, gby=[RegionID@0 as RegionID, UserID@1 as alias1], aggr=[]
                          RepartitionExec: partitioning=RoundRobinBatch(4), input_partitions=1
                            StreamingTableExec: partition_sizes=1, projection=[RegionID, UserID]
  prod1s:
    post_cbo: |
      OpenSearchSort(sort0=[$0], sort1=[$1], dir0=[DESC-nulls-last], dir1=[ASC-nulls-first], fetch=[10000], viableBackends=[[datafusion]])
        OpenSearchSort(sort0=[$0], sort1=[$1], dir0=[DESC-nulls-last], dir1=[ASC-nulls-first], fetch=[10], viableBackends=[[datafusion]])
          OpenSearchProject(u=[$1], RegionID=[$0], viableBackends=[[datafusion]])
            OpenSearchAggregate(group=[{0}], u=[COUNT(DISTINCT $1)], mode=[SINGLE], viableBackends=[[datafusion]])
              OpenSearchProject(RegionID=[$65], UserID=[$97], viableBackends=[[lucene, datafusion]])
                OpenSearchTableScan(table=[[<scrubbed>]], viableBackends=[[lucene, datafusion]])
    fragment: |
      [SHARD_FRAGMENT chosen_backend=datafusion tree_shape=NONE]
      OpenSearchSort(sort0=[$0], sort1=[$1], dir0=[DESC-nulls-last], dir1=[ASC-nulls-first], fetch=[10000], viableBackends=[[datafusion]])
        OpenSearchSort(sort0=[$0], sort1=[$1], dir0=[DESC-nulls-last], dir1=[ASC-nulls-first], fetch=[10], viableBackends=[[datafusion]])
          OpenSearchProject(u=[$1], RegionID=[$0], viableBackends=[[datafusion]])
            OpenSearchAggregate(group=[{0}], u=[COUNT(DISTINCT $1)], mode=[SINGLE], viableBackends=[[datafusion]])
              OpenSearchProject(RegionID=[$65], UserID=[$97], viableBackends=[[lucene, datafusion]])
                OpenSearchTableScan(table=[[<scrubbed>]], viableBackends=[[lucene, datafusion]])
    shard_physical_1seg: |
      ProjectionExec: expr=[count(DISTINCT <scrubbed>.UserID)@0 as u, RegionID@1 as RegionID]
        SortPreservingMergeExec: [count(DISTINCT <scrubbed>.UserID)@0 DESC NULLS LAST, RegionID@1 ASC], fetch=10
          SortExec: TopK(fetch=10), expr=[count(DISTINCT <scrubbed>.UserID)@0 DESC NULLS LAST, RegionID@1 ASC], preserve_partitioning=[true]
            ProjectionExec: expr=[count(alias1)@1 as count(DISTINCT <scrubbed>.UserID), RegionID@0 as RegionID]
              AggregateExec: mode=FinalPartitioned, gby=[RegionID@0 as RegionID], aggr=[count(alias1)]
                RepartitionExec: partitioning=Hash([RegionID@0], 4), input_partitions=4
                  AggregateExec: mode=Partial, gby=[RegionID@0 as RegionID], aggr=[count(alias1)]
                    AggregateExec: mode=FinalPartitioned, gby=[RegionID@0 as RegionID, alias1@1 as alias1], aggr=[]
                      RepartitionExec: partitioning=Hash([RegionID@0, alias1@1], 4), input_partitions=1
                        AggregateExec: mode=Partial, gby=[RegionID@0 as RegionID, UserID@1 as alias1], aggr=[]
                          DataSourceExec: file_groups={<scrubbed>}, projection=[RegionID, UserID], file_type=parquet
    shard_physical_nseg: |
      ProjectionExec: expr=[count(DISTINCT <scrubbed>.UserID)@0 as u, RegionID@1 as RegionID]
        SortPreservingMergeExec: [count(DISTINCT <scrubbed>.UserID)@0 DESC NULLS LAST, RegionID@1 ASC], fetch=10
          SortExec: TopK(fetch=10), expr=[count(DISTINCT <scrubbed>.UserID)@0 DESC NULLS LAST, RegionID@1 ASC], preserve_partitioning=[true]
            ProjectionExec: expr=[count(alias1)@1 as count(DISTINCT <scrubbed>.UserID), RegionID@0 as RegionID]
              AggregateExec: mode=FinalPartitioned, gby=[RegionID@0 as RegionID], aggr=[count(alias1)]
                RepartitionExec: partitioning=Hash([RegionID@0], 4), input_partitions=4
                  AggregateExec: mode=Partial, gby=[RegionID@0 as RegionID], aggr=[count(alias1)]
                    AggregateExec: mode=FinalPartitioned, gby=[RegionID@0 as RegionID, alias1@1 as alias1], aggr=[]
                      RepartitionExec: partitioning=Hash([RegionID@0, alias1@1], 4), input_partitions=2
                        AggregateExec: mode=Partial, gby=[RegionID@0 as RegionID, UserID@1 as alias1], aggr=[]
                          DataSourceExec: file_groups={<scrubbed>}, projection=[RegionID, UserID], file_type=parquet
