      OpenSearchSort(sort0=[$1], sort1=[$4], dir0=[DESC-nulls-last], dir1=[ASC-nulls-first], fetch=[10000], viableBackends=[[datafusion]])
        OpenSearchSort(sort0=[$1], sort1=[$4], dir0=[DESC-nulls-last], dir1=[ASC-nulls-first], fetch=[10], viableBackends=[[datafusion]])
          OpenSearchProject(sum(AdvEngineID)=[$1], c=[$2], avg(ResolutionWidth)=[ANNOTATED_PROJECT_EXPR(id=6, backends=[datafusion], /(ANNOTATED_PROJECT_EXPR(id=5, backends=[datafusion], CAST($3):DOUBLE), $4))], dc(UserID)=[$5], RegionID=[$0], viableBackends=[[datafusion]])
            OpenSearchAggregate(group=[{0}], sum(AdvEngineID)=[SUM($1)], c=[SUM($2)], $f3=[SUM($3)], $f4=[SUM($4)], dc(UserID)=[APPROX_COUNT_DISTINCT($5)], mode=[FINAL], viableBackends=[[datafusion]])
              OpenSearchExchangeReducer(viableBackends=[[datafusion]], exchange=[ExchangeInfo[distributionType=SINGLETON, partitionKeyIndices=[], partitionCount=0]])
                OpenSearchStageInputScan(childStageId=[0], viableBackends=[[datafusion]])
    shard_physical_1seg: |
      ProjectionExec: expr=[RegionID@0 as RegionID, sum(scrub_S005.AdvEngineID)[sum]@1 as sum(AdvEngineID), count(Int64(1))[count]@2 as c, sum(scrub_S005.ResolutionWidth)[sum]@3 as $f3, count(scrub_S005.ResolutionWidth)[count]@4 as $f4, approx_distinct(scrub_S005.UserID)[hll_registers]@5 as dc(UserID)]
        SortPreservingMergeExec: [count(Int64(1))@2 DESC NULLS LAST, RegionID@0 ASC], fetch=30
          SortExec: TopK(fetch=30), expr=[count(Int64(1))@2 DESC NULLS LAST, RegionID@0 ASC], preserve_partitioning=[true]
            AggregateExec: mode=PartialReduce, gby=[RegionID@0 as RegionID], aggr=[sum(scrub_S005.AdvEngineID), count(Int64(1)), sum(scrub_S005.ResolutionWidth), count(scrub_S005.ResolutionWidth), approx_distinct(scrub_S005.UserID)]
              RepartitionExec: partitioning=Hash([RegionID@0], 4), input_partitions=1
                AggregateExec: mode=Partial, gby=[RegionID@0 as RegionID], aggr=[sum(scrub_S005.AdvEngineID), count(Int64(1)), sum(scrub_S005.ResolutionWidth), count(scrub_S005.ResolutionWidth), approx_distinct(scrub_S005.UserID)]
                  DataSourceExec: file_groups={scrub_S001}, projection=[RegionID, AdvEngineID, ResolutionWidth, UserID], file_type=parquet
