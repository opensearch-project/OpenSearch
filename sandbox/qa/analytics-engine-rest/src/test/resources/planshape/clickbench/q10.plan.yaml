# Grouped combo by RegionID: SUM + COUNT + AVG(parts) + exact COUNT(DISTINCT UserID), with TopK on count (fetch=10).
# The exact dc keeps the whole aggregate exact: multi-shard gathers all rows to the coordinator, no per-shard partial.
query: q10
ppl_file: q10.ppl
applies: [prod2s, prod1s]
plans:
  prod2s:
    post_cbo: |
      OpenSearchSort(sort0=[$1], sort1=[$4], dir0=[DESC-nulls-last], dir1=[ASC-nulls-first], fetch=[10000], viableBackends=[[datafusion]])
        OpenSearchSort(sort0=[$1], sort1=[$4], dir0=[DESC-nulls-last], dir1=[ASC-nulls-first], fetch=[10], viableBackends=[[datafusion]])
          OpenSearchProject(sum(AdvEngineID)=[$1], c=[$2], avg(ResolutionWidth)=[ANNOTATED_PROJECT_EXPR(id=6, backends=[datafusion], /(ANNOTATED_PROJECT_EXPR(id=5, backends=[datafusion], CAST($3):DOUBLE), $4))], dc(UserID)=[$5], RegionID=[$0], viableBackends=[[datafusion]])
            OpenSearchAggregate(group=[{0}], sum(AdvEngineID)=[SUM($1)], c=[COUNT()], agg#2=[SUM($2)], agg#3=[COUNT($2)], dc(UserID)=[COUNT(DISTINCT $3)], mode=[SINGLE], viableBackends=[[datafusion]])
              OpenSearchExchangeReducer(viableBackends=[[datafusion]], exchange=[ExchangeInfo[distributionType=SINGLETON, partitionKeyIndices=[], partitionCount=0]])
                OpenSearchProject(RegionID=[$65], AdvEngineID=[$0], ResolutionWidth=[$69], UserID=[$97], viableBackends=[[lucene, datafusion]])
                  OpenSearchTableScan(table=[[<scrubbed>]], viableBackends=[[lucene, datafusion]])
    fragment: |
      [SHARD_FRAGMENT chosen_backend=datafusion tree_shape=NONE]
      OpenSearchProject(RegionID=[$65], AdvEngineID=[$0], ResolutionWidth=[$69], UserID=[$97], viableBackends=[[lucene, datafusion]])
        OpenSearchTableScan(table=[[<scrubbed>]], viableBackends=[[lucene, datafusion]])
      [COORDINATOR_REDUCE chosen_backend=datafusion tree_shape=NONE]
      OpenSearchSort(sort0=[$1], sort1=[$4], dir0=[DESC-nulls-last], dir1=[ASC-nulls-first], fetch=[10000], viableBackends=[[datafusion]])
        OpenSearchSort(sort0=[$1], sort1=[$4], dir0=[DESC-nulls-last], dir1=[ASC-nulls-first], fetch=[10], viableBackends=[[datafusion]])
          OpenSearchProject(sum(AdvEngineID)=[$1], c=[$2], avg(ResolutionWidth)=[ANNOTATED_PROJECT_EXPR(id=6, backends=[datafusion], /(ANNOTATED_PROJECT_EXPR(id=5, backends=[datafusion], CAST($3):DOUBLE), $4))], dc(UserID)=[$5], RegionID=[$0], viableBackends=[[datafusion]])
            OpenSearchAggregate(group=[{0}], sum(AdvEngineID)=[SUM($1)], c=[COUNT()], agg#2=[SUM($2)], agg#3=[COUNT($2)], dc(UserID)=[COUNT(DISTINCT $3)], mode=[SINGLE], viableBackends=[[datafusion]])
              OpenSearchExchangeReducer(viableBackends=[[datafusion]], exchange=[ExchangeInfo[distributionType=SINGLETON, partitionKeyIndices=[], partitionCount=0]])
                OpenSearchStageInputScan(childStageId=[0], viableBackends=[[datafusion]])
    shard_physical: |
      DataSourceExec: file_groups={<scrubbed>}, projection=[RegionID, AdvEngineID, ResolutionWidth, UserID], file_type=parquet
    coord_physical: |
      ProjectionExec: expr=[sum(input-0.AdvEngineID)@0 as sum(AdvEngineID), count(Int64(1))@1 as c, CASE WHEN count(input-0.ResolutionWidth) = Int64(0) THEN Float64(NULL) ELSE sum(input-0.ResolutionWidth) / count(input-0.ResolutionWidth) END@2 as avg(ResolutionWidth), count(DISTINCT input-0.UserID)@3 as dc(UserID), RegionID@4 as RegionID]
        SortPreservingMergeExec: [count(Int64(1))@1 DESC NULLS LAST, RegionID@4 ASC], fetch=10
          SortExec: TopK(fetch=10), expr=[count(Int64(1))@1 DESC NULLS LAST, RegionID@4 ASC], preserve_partitioning=[true]
            ProjectionExec: expr=[sum(input-0.AdvEngineID)@1 as sum(input-0.AdvEngineID), count(Int64(1))@2 as count(Int64(1)), CASE WHEN count(input-0.ResolutionWidth)@4 = 0 THEN NULL ELSE CAST(sum(input-0.ResolutionWidth)@3 AS Float64) / CAST(count(input-0.ResolutionWidth)@4 AS Float64) END as CASE WHEN count(input-0.ResolutionWidth) = Int64(0) THEN Float64(NULL) ELSE sum(input-0.ResolutionWidth) / count(input-0.ResolutionWidth) END, count(DISTINCT input-0.UserID)@5 as count(DISTINCT input-0.UserID), RegionID@0 as RegionID]
              AggregateExec: mode=FinalPartitioned, gby=[RegionID@0 as RegionID], aggr=[sum(input-0.AdvEngineID), count(Int64(1)), sum(input-0.ResolutionWidth), count(input-0.ResolutionWidth), count(DISTINCT input-0.UserID)]
                RepartitionExec: partitioning=Hash([RegionID@0], 4), input_partitions=4
                  AggregateExec: mode=Partial, gby=[RegionID@0 as RegionID], aggr=[sum(input-0.AdvEngineID), count(Int64(1)), sum(input-0.ResolutionWidth), count(input-0.ResolutionWidth), count(DISTINCT input-0.UserID)]
                    RepartitionExec: partitioning=RoundRobinBatch(4), input_partitions=1
                      StreamingTableExec: partition_sizes=1, projection=[RegionID, AdvEngineID, ResolutionWidth, UserID]
  prod1s:
    post_cbo: |
      OpenSearchSort(sort0=[$1], sort1=[$4], dir0=[DESC-nulls-last], dir1=[ASC-nulls-first], fetch=[10000], viableBackends=[[datafusion]])
        OpenSearchSort(sort0=[$1], sort1=[$4], dir0=[DESC-nulls-last], dir1=[ASC-nulls-first], fetch=[10], viableBackends=[[datafusion]])
          OpenSearchProject(sum(AdvEngineID)=[$1], c=[$2], avg(ResolutionWidth)=[ANNOTATED_PROJECT_EXPR(id=6, backends=[datafusion], /(ANNOTATED_PROJECT_EXPR(id=5, backends=[datafusion], CAST($3):DOUBLE), $4))], dc(UserID)=[$5], RegionID=[$0], viableBackends=[[datafusion]])
            OpenSearchAggregate(group=[{0}], sum(AdvEngineID)=[SUM($1)], c=[COUNT()], agg#2=[SUM($2)], agg#3=[COUNT($2)], dc(UserID)=[COUNT(DISTINCT $3)], mode=[SINGLE], viableBackends=[[datafusion]])
              OpenSearchProject(RegionID=[$65], AdvEngineID=[$0], ResolutionWidth=[$69], UserID=[$97], viableBackends=[[lucene, datafusion]])
                OpenSearchTableScan(table=[[<scrubbed>]], viableBackends=[[lucene, datafusion]])
    fragment: |
      [SHARD_FRAGMENT chosen_backend=datafusion tree_shape=NONE]
      OpenSearchSort(sort0=[$1], sort1=[$4], dir0=[DESC-nulls-last], dir1=[ASC-nulls-first], fetch=[10000], viableBackends=[[datafusion]])
        OpenSearchSort(sort0=[$1], sort1=[$4], dir0=[DESC-nulls-last], dir1=[ASC-nulls-first], fetch=[10], viableBackends=[[datafusion]])
          OpenSearchProject(sum(AdvEngineID)=[$1], c=[$2], avg(ResolutionWidth)=[ANNOTATED_PROJECT_EXPR(id=6, backends=[datafusion], /(ANNOTATED_PROJECT_EXPR(id=5, backends=[datafusion], CAST($3):DOUBLE), $4))], dc(UserID)=[$5], RegionID=[$0], viableBackends=[[datafusion]])
            OpenSearchAggregate(group=[{0}], sum(AdvEngineID)=[SUM($1)], c=[COUNT()], agg#2=[SUM($2)], agg#3=[COUNT($2)], dc(UserID)=[COUNT(DISTINCT $3)], mode=[SINGLE], viableBackends=[[datafusion]])
              OpenSearchProject(RegionID=[$65], AdvEngineID=[$0], ResolutionWidth=[$69], UserID=[$97], viableBackends=[[lucene, datafusion]])
                OpenSearchTableScan(table=[[<scrubbed>]], viableBackends=[[lucene, datafusion]])
    shard_physical_1seg: |
      ProjectionExec: expr=[sum(<scrubbed>.AdvEngineID)@0 as sum(AdvEngineID), count(Int64(1))@1 as c, CASE WHEN count(<scrubbed>.ResolutionWidth) = Int64(0) THEN Float64(NULL) ELSE sum(<scrubbed>.ResolutionWidth) / count(<scrubbed>.ResolutionWidth) END@2 as avg(ResolutionWidth), count(DISTINCT <scrubbed>.UserID)@3 as dc(UserID), RegionID@4 as RegionID]
        SortPreservingMergeExec: [count(Int64(1))@1 DESC NULLS LAST, RegionID@4 ASC], fetch=10
          SortExec: TopK(fetch=10), expr=[count(Int64(1))@1 DESC NULLS LAST, RegionID@4 ASC], preserve_partitioning=[true]
            ProjectionExec: expr=[sum(<scrubbed>.AdvEngineID)@1 as sum(<scrubbed>.AdvEngineID), count(Int64(1))@2 as count(Int64(1)), CASE WHEN count(<scrubbed>.ResolutionWidth)@4 = 0 THEN NULL ELSE CAST(sum(<scrubbed>.ResolutionWidth)@3 AS Float64) / CAST(count(<scrubbed>.ResolutionWidth)@4 AS Float64) END as CASE WHEN count(<scrubbed>.ResolutionWidth) = Int64(0) THEN Float64(NULL) ELSE sum(<scrubbed>.ResolutionWidth) / count(<scrubbed>.ResolutionWidth) END, count(DISTINCT <scrubbed>.UserID)@5 as count(DISTINCT <scrubbed>.UserID), RegionID@0 as RegionID]
              AggregateExec: mode=FinalPartitioned, gby=[RegionID@0 as RegionID], aggr=[sum(<scrubbed>.AdvEngineID), count(Int64(1)), sum(<scrubbed>.ResolutionWidth), count(<scrubbed>.ResolutionWidth), count(DISTINCT <scrubbed>.UserID)]
                RepartitionExec: partitioning=Hash([RegionID@0], 4), input_partitions=1
                  AggregateExec: mode=Partial, gby=[RegionID@0 as RegionID], aggr=[sum(<scrubbed>.AdvEngineID), count(Int64(1)), sum(<scrubbed>.ResolutionWidth), count(<scrubbed>.ResolutionWidth), count(DISTINCT <scrubbed>.UserID)]
                    DataSourceExec: file_groups={<scrubbed>}, projection=[RegionID, AdvEngineID, ResolutionWidth, UserID], file_type=parquet
    shard_physical_nseg: |
      ProjectionExec: expr=[sum(<scrubbed>.AdvEngineID)@0 as sum(AdvEngineID), count(Int64(1))@1 as c, CASE WHEN count(<scrubbed>.ResolutionWidth) = Int64(0) THEN Float64(NULL) ELSE sum(<scrubbed>.ResolutionWidth) / count(<scrubbed>.ResolutionWidth) END@2 as avg(ResolutionWidth), count(DISTINCT <scrubbed>.UserID)@3 as dc(UserID), RegionID@4 as RegionID]
        SortPreservingMergeExec: [count(Int64(1))@1 DESC NULLS LAST, RegionID@4 ASC], fetch=10
          SortExec: TopK(fetch=10), expr=[count(Int64(1))@1 DESC NULLS LAST, RegionID@4 ASC], preserve_partitioning=[true]
            ProjectionExec: expr=[sum(<scrubbed>.AdvEngineID)@1 as sum(<scrubbed>.AdvEngineID), count(Int64(1))@2 as count(Int64(1)), CASE WHEN count(<scrubbed>.ResolutionWidth)@4 = 0 THEN NULL ELSE CAST(sum(<scrubbed>.ResolutionWidth)@3 AS Float64) / CAST(count(<scrubbed>.ResolutionWidth)@4 AS Float64) END as CASE WHEN count(<scrubbed>.ResolutionWidth) = Int64(0) THEN Float64(NULL) ELSE sum(<scrubbed>.ResolutionWidth) / count(<scrubbed>.ResolutionWidth) END, count(DISTINCT <scrubbed>.UserID)@5 as count(DISTINCT <scrubbed>.UserID), RegionID@0 as RegionID]
              AggregateExec: mode=FinalPartitioned, gby=[RegionID@0 as RegionID], aggr=[sum(<scrubbed>.AdvEngineID), count(Int64(1)), sum(<scrubbed>.ResolutionWidth), count(<scrubbed>.ResolutionWidth), count(DISTINCT <scrubbed>.UserID)]
                RepartitionExec: partitioning=Hash([RegionID@0], 4), input_partitions=2
                  AggregateExec: mode=Partial, gby=[RegionID@0 as RegionID], aggr=[sum(<scrubbed>.AdvEngineID), count(Int64(1)), sum(<scrubbed>.ResolutionWidth), count(<scrubbed>.ResolutionWidth), count(DISTINCT <scrubbed>.UserID)]
                    DataSourceExec: file_groups={<scrubbed>}, projection=[RegionID, AdvEngineID, ResolutionWidth, UserID], file_type=parquet
