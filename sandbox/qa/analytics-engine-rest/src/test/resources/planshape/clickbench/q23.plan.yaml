# Grouped COUNT + exact COUNT(DISTINCT UserID) by SearchPhrase, triple filter (ILIKE, !=, NOT ILIKE) and TopK.
# The exact dc keeps the aggregate exact: multi-shard gathers all rows to the coordinator, no per-shard partial.
query: q23
ppl_file: q23.ppl
applies: [prod2s, prod1s]
plans:
  prod2s:
    post_cbo: |
      OpenSearchSort(sort0=[$0], dir0=[DESC-nulls-last], fetch=[10000], viableBackends=[[datafusion]])
        OpenSearchSort(sort0=[$0], dir0=[DESC-nulls-last], fetch=[10], viableBackends=[[datafusion]])
          OpenSearchProject(c=[$1], dc(UserID)=[$2], SearchPhrase=[$0], viableBackends=[[datafusion]])
            OpenSearchAggregate(group=[{0}], c=[COUNT()], dc(UserID)=[COUNT(DISTINCT $1)], mode=[SINGLE], viableBackends=[[datafusion]])
              OpenSearchExchangeReducer(viableBackends=[[datafusion]], exchange=[ExchangeInfo[distributionType=SINGLETON, partitionKeyIndices=[], partitionCount=0]])
                OpenSearchProject(SearchPhrase=[$74], UserID=[$97], viableBackends=[[lucene, datafusion]])
                  OpenSearchFilter(condition=[AND(ANNOTATED_PREDICATE(id=0, backends=[lucene, datafusion], ILIKE($83, '%Google%', '\')), ANNOTATED_PREDICATE(id=1, backends=[lucene, datafusion], <>($74, '')), NOT(ANNOTATED_PREDICATE(id=2, backends=[lucene, datafusion], ILIKE($85, '%.google.%', '\'))))], viableBackends=[[lucene, datafusion]])
                    OpenSearchTableScan(table=[[<scrubbed>]], viableBackends=[[lucene, datafusion]])
    fragment: |
      [SHARD_FRAGMENT chosen_backend=datafusion tree_shape=CONJUNCTIVE]
      OpenSearchProject(SearchPhrase=[$74], UserID=[$97], viableBackends=[[lucene, datafusion]])
        OpenSearchFilter(condition=[AND(ANNOTATED_PREDICATE(id=0, backends=[lucene, datafusion], ILIKE($83, '%Google%', '\')), ANNOTATED_PREDICATE(id=1, backends=[lucene, datafusion], <>($74, '')), NOT(ANNOTATED_PREDICATE(id=2, backends=[lucene, datafusion], ILIKE($85, '%.google.%', '\'))))], viableBackends=[[lucene, datafusion]])
          OpenSearchTableScan(table=[[<scrubbed>]], viableBackends=[[lucene, datafusion]])
      [COORDINATOR_REDUCE chosen_backend=datafusion tree_shape=NONE]
      OpenSearchSort(sort0=[$0], dir0=[DESC-nulls-last], fetch=[10000], viableBackends=[[datafusion]])
        OpenSearchSort(sort0=[$0], dir0=[DESC-nulls-last], fetch=[10], viableBackends=[[datafusion]])
          OpenSearchProject(c=[$1], dc(UserID)=[$2], SearchPhrase=[$0], viableBackends=[[datafusion]])
            OpenSearchAggregate(group=[{0}], c=[COUNT()], dc(UserID)=[COUNT(DISTINCT $1)], mode=[SINGLE], viableBackends=[[datafusion]])
              OpenSearchExchangeReducer(viableBackends=[[datafusion]], exchange=[ExchangeInfo[distributionType=SINGLETON, partitionKeyIndices=[], partitionCount=0]])
                OpenSearchStageInputScan(childStageId=[0], viableBackends=[[datafusion]])
    shard_physical_1seg: |
      CooperativeExec
        QueryShardExec: partitions=1, segments=1, ordering=unsorted
    shard_physical_nseg: |
      CooperativeExec
        QueryShardExec: partitions=2, segments=2, ordering=unsorted
    coord_physical: |
      ProjectionExec: expr=[count(Int64(1))@0 as c, count(DISTINCT input-0.UserID)@1 as dc(UserID), SearchPhrase@2 as SearchPhrase]
        SortPreservingMergeExec: [count(Int64(1))@0 DESC NULLS LAST], fetch=10
          SortExec: TopK(fetch=10), expr=[count(Int64(1))@0 DESC NULLS LAST], preserve_partitioning=[true]
            ProjectionExec: expr=[count(Int64(1))@1 as count(Int64(1)), count(DISTINCT input-0.UserID)@2 as count(DISTINCT input-0.UserID), SearchPhrase@0 as SearchPhrase]
              AggregateExec: mode=FinalPartitioned, gby=[SearchPhrase@0 as SearchPhrase], aggr=[count(Int64(1)), count(DISTINCT input-0.UserID)]
                RepartitionExec: partitioning=Hash([SearchPhrase@0], 4), input_partitions=4
                  AggregateExec: mode=Partial, gby=[SearchPhrase@0 as SearchPhrase], aggr=[count(Int64(1)), count(DISTINCT input-0.UserID)]
                    RepartitionExec: partitioning=RoundRobinBatch(4), input_partitions=1
                      StreamingTableExec: partition_sizes=1, projection=[SearchPhrase, UserID]
  prod1s:
    post_cbo: |
      OpenSearchSort(sort0=[$0], dir0=[DESC-nulls-last], fetch=[10000], viableBackends=[[datafusion]])
        OpenSearchSort(sort0=[$0], dir0=[DESC-nulls-last], fetch=[10], viableBackends=[[datafusion]])
          OpenSearchProject(c=[$1], dc(UserID)=[$2], SearchPhrase=[$0], viableBackends=[[datafusion]])
            OpenSearchAggregate(group=[{0}], c=[COUNT()], dc(UserID)=[COUNT(DISTINCT $1)], mode=[SINGLE], viableBackends=[[datafusion]])
              OpenSearchProject(SearchPhrase=[$74], UserID=[$97], viableBackends=[[lucene, datafusion]])
                OpenSearchFilter(condition=[AND(ANNOTATED_PREDICATE(id=0, backends=[lucene, datafusion], ILIKE($83, '%Google%', '\')), ANNOTATED_PREDICATE(id=1, backends=[lucene, datafusion], <>($74, '')), NOT(ANNOTATED_PREDICATE(id=2, backends=[lucene, datafusion], ILIKE($85, '%.google.%', '\'))))], viableBackends=[[lucene, datafusion]])
                  OpenSearchTableScan(table=[[<scrubbed>]], viableBackends=[[lucene, datafusion]])
    fragment: |
      [SHARD_FRAGMENT chosen_backend=datafusion tree_shape=CONJUNCTIVE]
      OpenSearchSort(sort0=[$0], dir0=[DESC-nulls-last], fetch=[10000], viableBackends=[[datafusion]])
        OpenSearchSort(sort0=[$0], dir0=[DESC-nulls-last], fetch=[10], viableBackends=[[datafusion]])
          OpenSearchProject(c=[$1], dc(UserID)=[$2], SearchPhrase=[$0], viableBackends=[[datafusion]])
            OpenSearchAggregate(group=[{0}], c=[COUNT()], dc(UserID)=[COUNT(DISTINCT $1)], mode=[SINGLE], viableBackends=[[datafusion]])
              OpenSearchProject(SearchPhrase=[$74], UserID=[$97], viableBackends=[[lucene, datafusion]])
                OpenSearchFilter(condition=[AND(ANNOTATED_PREDICATE(id=0, backends=[lucene, datafusion], ILIKE($83, '%Google%', '\')), ANNOTATED_PREDICATE(id=1, backends=[lucene, datafusion], <>($74, '')), NOT(ANNOTATED_PREDICATE(id=2, backends=[lucene, datafusion], ILIKE($85, '%.google.%', '\'))))], viableBackends=[[lucene, datafusion]])
                  OpenSearchTableScan(table=[[<scrubbed>]], viableBackends=[[lucene, datafusion]])
    shard_physical_1seg: |
      ProjectionExec: expr=[count(Int64(1))@0 as c, count(DISTINCT <scrubbed>.UserID)@1 as dc(UserID), SearchPhrase@2 as SearchPhrase]
        SortPreservingMergeExec: [count(Int64(1))@0 DESC NULLS LAST], fetch=10
          SortExec: TopK(fetch=10), expr=[count(Int64(1))@0 DESC NULLS LAST], preserve_partitioning=[true]
            ProjectionExec: expr=[count(Int64(1))@1 as count(Int64(1)), count(DISTINCT <scrubbed>.UserID)@2 as count(DISTINCT <scrubbed>.UserID), SearchPhrase@0 as SearchPhrase]
              AggregateExec: mode=FinalPartitioned, gby=[SearchPhrase@0 as SearchPhrase], aggr=[count(Int64(1)), count(DISTINCT <scrubbed>.UserID)]
                RepartitionExec: partitioning=Hash([SearchPhrase@0], 4), input_partitions=4
                  AggregateExec: mode=Partial, gby=[SearchPhrase@0 as SearchPhrase], aggr=[count(Int64(1)), count(DISTINCT <scrubbed>.UserID)]
                    RepartitionExec: partitioning=RoundRobinBatch(4), input_partitions=1
                      QueryShardExec: partitions=1, segments=1, ordering=unsorted
    shard_physical_nseg: |
      ProjectionExec: expr=[count(Int64(1))@0 as c, count(DISTINCT <scrubbed>.UserID)@1 as dc(UserID), SearchPhrase@2 as SearchPhrase]
        SortPreservingMergeExec: [count(Int64(1))@0 DESC NULLS LAST], fetch=10
          SortExec: TopK(fetch=10), expr=[count(Int64(1))@0 DESC NULLS LAST], preserve_partitioning=[true]
            ProjectionExec: expr=[count(Int64(1))@1 as count(Int64(1)), count(DISTINCT <scrubbed>.UserID)@2 as count(DISTINCT <scrubbed>.UserID), SearchPhrase@0 as SearchPhrase]
              AggregateExec: mode=FinalPartitioned, gby=[SearchPhrase@0 as SearchPhrase], aggr=[count(Int64(1)), count(DISTINCT <scrubbed>.UserID)]
                RepartitionExec: partitioning=Hash([SearchPhrase@0], 4), input_partitions=4
                  AggregateExec: mode=Partial, gby=[SearchPhrase@0 as SearchPhrase], aggr=[count(Int64(1)), count(DISTINCT <scrubbed>.UserID)]
                    RepartitionExec: partitioning=RoundRobinBatch(4), input_partitions=2
                      QueryShardExec: partitions=2, segments=2, ordering=unsorted
