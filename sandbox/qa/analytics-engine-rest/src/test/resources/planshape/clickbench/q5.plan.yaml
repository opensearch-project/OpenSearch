# Ungrouped exact COUNT(DISTINCT UserID): decomposed to COUNT(*) over an inner GROUP BY UserID so the
# dedup parallelizes across shards (inner splits PARTIAL/FINAL, outer count SINGLE); no HLL/approx.
# Implicit IS NOT NULL on UserID blocked from lucene (production blocklist); parquet predicate pushdown.
query: q5
ppl_file: q5.ppl
applies: [prod2s, prod1s]
plans:
  prod2s:
    post_cbo: |
      OpenSearchAggregate(group=[{}], dc(UserID)=[COUNT()], mode=[SINGLE], viableBackends=[[datafusion]])
        OpenSearchAggregate(group=[{0}], mode=[FINAL], viableBackends=[[datafusion]])
          OpenSearchExchangeReducer(viableBackends=[[datafusion]], exchange=[ExchangeInfo[distributionType=SINGLETON, partitionKeyIndices=[], partitionCount=0]])
            OpenSearchAggregate(group=[{0}], mode=[PARTIAL], viableBackends=[[datafusion]])
              OpenSearchFilter(condition=[ANNOTATED_PREDICATE(id=1, backends=[datafusion], IS NOT NULL($0))], viableBackends=[[datafusion]])
                OpenSearchProject(UserID=[$97], viableBackends=[[datafusion]])
                  OpenSearchFilter(condition=[ANNOTATED_PREDICATE(id=0, backends=[datafusion], IS NOT NULL($97))], viableBackends=[[datafusion]])
                    OpenSearchTableScan(table=[[<scrubbed>]], viableBackends=[[lucene, datafusion]])
    fragment: |
      [SHARD_FRAGMENT chosen_backend=datafusion tree_shape=NONE]
      OpenSearchAggregate(group=[{0}], mode=[PARTIAL], viableBackends=[[datafusion]])
        OpenSearchFilter(condition=[ANNOTATED_PREDICATE(id=1, backends=[datafusion], IS NOT NULL($0))], viableBackends=[[datafusion]])
          OpenSearchProject(UserID=[$97], viableBackends=[[datafusion]])
            OpenSearchFilter(condition=[ANNOTATED_PREDICATE(id=0, backends=[datafusion], IS NOT NULL($97))], viableBackends=[[datafusion]])
              OpenSearchTableScan(table=[[<scrubbed>]], viableBackends=[[lucene, datafusion]])
      [COORDINATOR_REDUCE chosen_backend=datafusion tree_shape=NONE]
      OpenSearchAggregate(group=[{}], dc(UserID)=[COUNT()], mode=[SINGLE], viableBackends=[[datafusion]])
        OpenSearchAggregate(group=[{0}], mode=[FINAL], viableBackends=[[datafusion]])
          OpenSearchExchangeReducer(viableBackends=[[datafusion]], exchange=[ExchangeInfo[distributionType=SINGLETON, partitionKeyIndices=[], partitionCount=0]])
            OpenSearchStageInputScan(childStageId=[0], viableBackends=[[datafusion]])
    shard_physical_1seg: |
      AggregateExec: mode=Partial, gby=[UserID@0 as UserID], aggr=[]
        FilterExec: UserID@0 IS NOT NULL
          RepartitionExec: partitioning=RoundRobinBatch(4), input_partitions=1
            DataSourceExec: file_groups={<scrubbed>}, projection=[UserID], file_type=parquet, predicate=UserID@89 IS NOT NULL, pruning_predicate=UserID_null_count@1 != row_count@0, required_guarantees=[]
    shard_physical_nseg: |
      AggregateExec: mode=Partial, gby=[UserID@0 as UserID], aggr=[]
        FilterExec: UserID@0 IS NOT NULL
          RepartitionExec: partitioning=RoundRobinBatch(4), input_partitions=2
            DataSourceExec: file_groups={<scrubbed>}, projection=[UserID], file_type=parquet, predicate=UserID@89 IS NOT NULL, pruning_predicate=UserID_null_count@1 != row_count@0, required_guarantees=[]
    coord_physical: |
      AggregateExec: mode=Final, gby=[], aggr=[count(1) as dc(UserID)]
        CoalescePartitionsExec
          AggregateExec: mode=Partial, gby=[], aggr=[count(1) as dc(UserID)]
            ProjectionExec: expr=[]
              AggregateExec: mode=FinalPartitioned, gby=[UserID@0 as UserID], aggr=[]
                RepartitionExec: partitioning=Hash([UserID@0], 4), input_partitions=4
                  AggregateExec: mode=Partial, gby=[UserID@0 as UserID], aggr=[]
                    RepartitionExec: partitioning=RoundRobinBatch(4), input_partitions=1
                      StreamingTableExec: partition_sizes=1, projection=[UserID]
  prod1s:
    post_cbo: |
      OpenSearchAggregate(group=[{}], dc(UserID)=[COUNT()], mode=[SINGLE], viableBackends=[[datafusion]])
        OpenSearchAggregate(group=[{0}], mode=[SINGLE], viableBackends=[[datafusion]])
          OpenSearchFilter(condition=[ANNOTATED_PREDICATE(id=1, backends=[datafusion], IS NOT NULL($0))], viableBackends=[[datafusion]])
            OpenSearchProject(UserID=[$97], viableBackends=[[datafusion]])
              OpenSearchFilter(condition=[ANNOTATED_PREDICATE(id=0, backends=[datafusion], IS NOT NULL($97))], viableBackends=[[datafusion]])
                OpenSearchTableScan(table=[[<scrubbed>]], viableBackends=[[lucene, datafusion]])
    fragment: |
      [SHARD_FRAGMENT chosen_backend=datafusion tree_shape=NONE]
      OpenSearchAggregate(group=[{}], dc(UserID)=[COUNT()], mode=[SINGLE], viableBackends=[[datafusion]])
        OpenSearchAggregate(group=[{0}], mode=[SINGLE], viableBackends=[[datafusion]])
          OpenSearchFilter(condition=[ANNOTATED_PREDICATE(id=1, backends=[datafusion], IS NOT NULL($0))], viableBackends=[[datafusion]])
            OpenSearchProject(UserID=[$97], viableBackends=[[datafusion]])
              OpenSearchFilter(condition=[ANNOTATED_PREDICATE(id=0, backends=[datafusion], IS NOT NULL($97))], viableBackends=[[datafusion]])
                OpenSearchTableScan(table=[[<scrubbed>]], viableBackends=[[lucene, datafusion]])
    shard_physical_1seg: |
      AggregateExec: mode=Final, gby=[], aggr=[count(1) as dc(UserID)]
        CoalescePartitionsExec
          AggregateExec: mode=Partial, gby=[], aggr=[count(1) as dc(UserID)]
            ProjectionExec: expr=[]
              AggregateExec: mode=FinalPartitioned, gby=[UserID@0 as UserID], aggr=[]
                RepartitionExec: partitioning=Hash([UserID@0], 4), input_partitions=4
                  AggregateExec: mode=Partial, gby=[UserID@0 as UserID], aggr=[]
                    FilterExec: UserID@0 IS NOT NULL
                      RepartitionExec: partitioning=RoundRobinBatch(4), input_partitions=1
                        DataSourceExec: file_groups={<scrubbed>}, projection=[UserID], file_type=parquet, predicate=UserID@89 IS NOT NULL, pruning_predicate=UserID_null_count@1 != row_count@0, required_guarantees=[]
    shard_physical_nseg: |
      AggregateExec: mode=Final, gby=[], aggr=[count(1) as dc(UserID)]
        CoalescePartitionsExec
          AggregateExec: mode=Partial, gby=[], aggr=[count(1) as dc(UserID)]
            ProjectionExec: expr=[]
              AggregateExec: mode=FinalPartitioned, gby=[UserID@0 as UserID], aggr=[]
                RepartitionExec: partitioning=Hash([UserID@0], 4), input_partitions=4
                  AggregateExec: mode=Partial, gby=[UserID@0 as UserID], aggr=[]
                    FilterExec: UserID@0 IS NOT NULL
                      RepartitionExec: partitioning=RoundRobinBatch(4), input_partitions=2
                        DataSourceExec: file_groups={<scrubbed>}, projection=[UserID], file_type=parquet, predicate=UserID@89 IS NOT NULL, pruning_predicate=UserID_null_count@1 != row_count@0, required_guarantees=[]
