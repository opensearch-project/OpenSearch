\* Seal ordering and ack pipelining, at the shipped write-side ordering: SEQUENCED = TRUE
\* means the fence CAS is issued only after the metadata PUT completed. All properties must
\* hold. The refuted concurrent ordering is reproduced by flipping SEQUENCED to FALSE, which
\* TLC refutes with a NoAckedWriteLoss counterexample (see the module comment). Bounds kept modest because this cfg checks LIVENESS properties, whose
\* cost dominates state count.
\* Seal ordering: a takeover claims the chain before reading its restore point.
SPECIFICATION Spec
CONSTANTS
  Writers = {w1, w2, w3}
  NoWriter = NoWriter
  MaxTerm = 3
  MaxOps = 3
  SEQUENCED = TRUE
INVARIANTS
  TypeOK
  MutualExclusion
  NoAckedWriteLoss
  AckAttribution
  OwnerTermAgreement
PROPERTIES
  TermMonotonic
  SeqMonotonic
  FencedTerminal
  HigherTermPrevails
CHECK_DEADLOCK FALSE
