\* Seal ordering. Bounds kept modest because this module checks LIVENESS properties, whose
\* cost dominates state count (4 writers/4 terms/4 ops takes ~2 minutes). That larger bound
\* was verified out-of-band: 3,691,705 distinct states, complete, all properties hold.
\* Seal ordering: a takeover claims the chain before reading its restore point.
SPECIFICATION Spec
CONSTANTS
  Writers = {w1, w2, w3}
  NoWriter = NoWriter
  MaxTerm = 3
  MaxOps = 3
INVARIANTS
  TypeOK
  MutualExclusion
  NoAckedWriteLoss
  AckAttribution
  OwnerTermAgreement
PROPERTIES
  TermMonotonic
  SeqMonotonic
  FencedTerminal
  HigherTermPrevails
CHECK_DEADLOCK FALSE
