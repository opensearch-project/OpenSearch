\* Segment flow and GC: hydration must never lose a file it still needs.
SPECIFICATION Spec
CONSTANTS
  Writers = {w1, w2, w3}
  Files = {f1, f2}
  NoWriter = NoWriter
  MaxTerm = 3
INVARIANTS
  HydrationIntegrity
  HydrationComplete
  LatestPublishedByOwner
  OwnerNeverReadUnsealed
CHECK_DEADLOCK FALSE
