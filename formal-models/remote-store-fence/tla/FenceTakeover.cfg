\* Cross-term takeover. Symmetry is sound here because only invariants are checked against this
\* module - it is NOT generally sound with liveness properties, so do not add PROPERTIES without
\* removing SYMMETRY. Verified out-of-band at MaxTerm 5 and 8 (no additional behaviour: the
\* failover chain is bounded by the number of unborn writers, so MaxTerm >= |Writers| saturates).
SPECIFICATION Spec
CONSTANTS
  Writers = {w1, w2, w3, w4}
  MaxTerm = 4
  MaxOps = 3
SYMMETRY Symm
INVARIANTS
  MutualExclusion
  NoAckedWriteLoss
  NoHigherTermDefeat
  AckAttribution
CHECK_DEADLOCK FALSE
