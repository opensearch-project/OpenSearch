\* Auto-restore trigger at the SHIPPED coupling: FENCED = TRUE (the trigger requires
\* index.remote_store.fencing.enabled). All invariants and the liveness property must
\* hold: no acked write loss across the trigger, single lineage, single restore target,
\* health that never overstates availability (RED until the restored primary starts),
\* the node-left grace window gating the trigger but not the operator API, and RED
\* always resolves (exhaustion-aware, with the window's expiry weakly fair).
\* The refuted ungated design (FENCED = FALSE) is reproduced by flipping the constant,
\* which TLC refutes with a NoAckedWriteLoss counterexample - the formal justification
\* for gating auto-restore on fencing.
SPECIFICATION Spec
CONSTANTS
  Writers = {w1, w2, w3}
  Nodes = {n1, n2}
  NoWriter = NoWriter
  MaxOps = 3
  MaxTerm = 4
  FENCED = TRUE
INVARIANTS
  TypeOK
  NoAckedWriteLoss
  SingleInSyncServing
  SingleRestoreTarget
  HealthFaithful
PROPERTIES
  RedEventuallyResolves
CHECK_DEADLOCK FALSE
