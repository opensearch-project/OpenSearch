\* Equal-term relocation handoff, including retried relocation, a concurrent higher-term
\* takeover sweeping the shared object, target loss, a revert that fails without landing, and a
\* transfer or revert that lands unseen. SETTLE_PENDING = FALSE reproduces the code before the
\* transfer and the revert settled such a write, which TLC refutes with a NoSpuriousFencing
\* counterexample.
SPECIFICATION Spec
CONSTANTS
  MaxOps = 4
  MaxAttempts = 3
  SETTLE_PENDING = TRUE
INVARIANTS
  MutualExclusion
  NoSpuriousFencing
  NoAckedWriteLoss
  TargetAcksAreDurable
  AckAttribution
CHECK_DEADLOCK FALSE
