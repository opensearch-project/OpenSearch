---
"Test percolator basics via rest":
  - do:
      indices.create:
        index: queries_index
        body:
          mappings:
            properties:
              query:
                type: percolator
              foo:
                type: keyword

  - do:
      indices.create:
        index: documents_index
        body:
          mappings:
            properties:
              foo:
                type: keyword

  - do:
      index:
        index: queries_index
        id:   test_percolator
        body:
          query:
            match_all: {}

  - do:
      index:
        index: documents_index
        id: some_id
        body:
          foo: bar

  - do:
        indices.refresh: {}

  - do:
      search:
        rest_total_hits_as_int: true
        body:
          - query:
              percolate:
                field: query
                document:
                  foo: bar
  - match:  { hits.total:     1  }

  - do:
      msearch:
        rest_total_hits_as_int: true
        body:
          - index: queries_index
          - query:
              percolate:
                field: query
                document:
                  foo: bar
  - match:  { responses.0.hits.total:     1  }

  - do:
      search:
        rest_total_hits_as_int: true
        body:
          - query:
              percolate:
                field: query
                index: documents_index
                id: some_id
  - match:  { hits.total:     1  }

  - do:
      msearch:
        rest_total_hits_as_int: true
        body:
          - index: queries_index
          - query:
              percolate:
                field: query
                index: documents_index
                id: some_id
  - match:  { responses.0.hits.total:     1  }

  - do:
      catch: bad_request
      index:
        index: queries_index
        body:
          query:
            query_string:
              query: "unmapped: *"

  - do:
      catch: bad_request
      index:
        index: queries_index
        body:
          query:
            query_string:
              query: "_exists_: unmappedField"

  - do:
        catch: bad_request
        index:
          index: queries_index
          body:
            query:
              query_string:
                query: "unmappedField: <100"

  - do:
      catch: bad_request
      index:
        index: queries_index
        body:
          query:
            query_string:
              query: "unmappedField: test~"

  - do:
      catch: bad_request
      index:
        index: queries_index
        body:
          query:
            query_string:
              query: "unmappedField: test*"

---
"Percolate a query_string wildcard query on a wildcard field":
  - skip:
      version: " - 3.9.99"
      reason: "query_string did not use the wildcard field query before 3.10"
  - do:
      indices.create:
        index: wildcard_queries
        body:
          mappings:
            properties:
              query:
                type: percolator
              my_field:
                type: wildcard

  - do:
      index:
        index: wildcard_queries
        id: query_string
        refresh: true
        body:
          query:
            query_string:
              query: "my_field:*test*"

  - do:
      search:
        index: wildcard_queries
        body:
          query:
            percolate:
              field: query
              document:
                my_field: "apache_access_test.log"
  - match: { hits.total.value: 1 }
  - match: { hits.hits.0._id: "query_string" }
