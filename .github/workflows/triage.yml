name: Auto triage based on the component label in issue

on:
  issues:
    types: [opened, reopened, transferred]

permissions:
  issues: write

jobs:
  apply-label:
    if: github.repository == 'opensearch-project/OpenSearch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { issue, repository } = context.payload;
            const { number, body, user } = issue;
            const { owner, name } = repository;

            // Must match the "Related component" options in .github/ISSUE_TEMPLATE/*.yml.
            const components = [
              'Build',
              'Clients',
              'Cluster Manager',
              'Extensions',
              'Indexing:Performance',
              'Indexing:Replication',
              'Indexing',
              'Libraries',
              'Other',
              'Plugins',
              'Search:Aggregations',
              'Search:Performance',
              'Search:Query Capabilities',
              'Search:Query Insights',
              'Search:Relevance',
              'Search:Remote Search',
              'Search:Resiliency',
              'Search:Searchable Snapshots',
              'Search',
              'Storage:Durability',
              'Storage:Performance',
              'Storage:Remote',
              'Storage:Snapshots',
              'Storage',
              'ShardManagement:Placement',
              'ShardManagement:Performance',
              'ShardManagement:Resiliency',
              'ShardManagement:Insights',
            ];
            const canonical = (value) =>
              components.find((c) => c.toLowerCase() === value.trim().toLowerCase());

            const match = /###\s*Related\s+component[ \t]*\r?\n\s*([^\r\n]*)/i.exec(body || '');
            // An empty section is followed directly by the next heading.
            const provided = match && match[1].startsWith('#') === false ? match[1].trim() : '';
            const component = canonical(provided);
            const alreadyLabeled = (issue.labels || []).some((l) => canonical(l.name));

            if (component) {
              await github.rest.issues.addLabels({
                owner: owner.login,
                repo: name,
                issue_number: number,
                labels: [component]
              });
            } else if (alreadyLabeled === false) {
              const reason = provided && provided !== '_No response_'
                ? `\`${provided}\` is not a recognized component. `
                : '';
              await github.rest.issues.createComment({
                owner: owner.login,
                repo: name,
                issue_number: number,
                body: `@${user.login} ${reason}Please reply to this comment with the relevant component to ensure it gets properly triaged:\n\n${components.map((c) => `- ${c}`).join('\n')}\n\nReply with the component name, and we'll label this issue appropriately.`
              });
              await github.rest.issues.addLabels({
                owner: owner.login,
                repo: name,
                issue_number: number,
                labels: ['missing-component']
              });
            }

            // Always add the untriaged label
            await github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['untriaged']
            });
